<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 1.7</title><desc id="d">Gilang mengikuti rangkaian langkah berirama. Pilihan P: Menyesuaikan langkah dengan hitungan dan kemampuan tubuh. Pilihan Q: Memaksakan gerak sampai sakit.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 1.7</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Gilang mengikuti rangkaian langkah berirama.</text><circle cx="160" cy="245" r="35" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="160" y="253" font-size="25" text-anchor="middle" fill="#fff">1</text><circle cx="290" cy="245" r="35" fill="#0d9488" stroke="#24334b" stroke-width="2"/><text x="290" y="253" font-size="25" text-anchor="middle" fill="#fff">2</text><circle cx="420" cy="245" r="35" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="420" y="253" font-size="25" text-anchor="middle" fill="#fff">3</text><circle cx="550" cy="245" r="35" fill="#0d9488" stroke="#24334b" stroke-width="2"/><text x="550" y="253" font-size="25" text-anchor="middle" fill="#fff">4</text><text x="360" y="355" font-size="23" text-anchor="middle" fill="#24334b">Langkah mengikuti hitungan</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Menyesuaikan langkah</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">dengan hitungan dan</text><text x="55" y="588" font-size="22" text-anchor="start" fill="#24334b">kemampuan tubuh</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Memaksakan gerak sampai</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">sakit</text></g></svg>
