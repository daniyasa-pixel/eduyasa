<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 854" role="img" aria-labelledby="title desc"><title id="title">Tanaman tomat dari biji</title><desc id="desc">Urutan tomat: A biji; B akar kecil keluar; C tanaman muda berdaun; D berbunga; E berbuah.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="854" rx="24" fill="#f0fdfa"/><text x="360" y="40" font-size="28" text-anchor="middle" fill="#17324d">Tanaman tomat dari biji</text><rect x="24" y="64" width="672" height="132" rx="18" fill="#dcfce7"/><text x="45" y="101" font-size="25" text-anchor="start" fill="#17324d">A</text><g transform="translate(135 70) scale(.95)"><ellipse cx="60" cy="64" rx="22" ry="30" fill="#84cc16" stroke="#34594a" stroke-width="2"/><path d="M54 42 Q72 65 56 89" fill="none" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="108" font-size="25" text-anchor="start" fill="#17324d">Biji.</text><path d="M675 199 L675 212 M668 206 L675 213 L682 206" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="214" width="672" height="132" rx="18" fill="#dbeafe"/><text x="45" y="251" font-size="25" text-anchor="start" fill="#17324d">B</text><g transform="translate(135 220) scale(.95)"><ellipse cx="60" cy="53" rx="18" ry="23" fill="#a3e635" stroke="#34594a" stroke-width="2"/><path d="M58 73 Q64 91 50 108 M58 87 L75 97" fill="none" stroke="#92400e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 40 Q63 18 77 13" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="258" font-size="25" text-anchor="start" fill="#17324d">Akar kecil keluar dari biji.</text><path d="M675 349 L675 362 M668 356 L675 363 L682 356" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="364" width="672" height="132" rx="18" fill="#fef3c7"/><text x="45