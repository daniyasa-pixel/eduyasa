<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Jadwal kegiatan sore</title><desc id="desc">Tabel waktu berisi istirahat 30 menit, tugas 45 menit, bermain aktif 30 menit, dan layar 120 menit tanpa jeda.</desc><rect width="640" height="360" rx="24" fill="#f6fbff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#287da8" stroke-width="3"/><text x="320" y="55" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Jadwal sore</text><rect x="90" y="80" width="460" height="44" rx="8" fill="#dbeafe"/><text x="115" y="109" font-family="sans-serif" font-size="19">Istirahat</text><text x="520" y="109" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="700">30 menit</text><rect x="90" y="135" width="460" height="44" rx="8" fill="#fef3c7"/><text x="115" y="164" font-family="sans-serif" font-size="19">Tugas</text><text x="520" y="164" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="700">45 menit</text><rect x="90" y="190" width="460" height="44" rx="8" fill="#dcfce7"/><text x="115" y="219" font-family="sans-serif" font-size="19">Bermain aktif</text><text x="520" y="219" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="700">30 menit</text><rect x="90" y="245" width="460" height="44" rx="8" fill="#fee2e2"/><text x="115" y="274" font-family="sans-serif" font-size="19">Layar tanpa jeda</text><text x="520" y="274" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="700">120 menit</text></svg>