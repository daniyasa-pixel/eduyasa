<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Dua ingatan tentang jembatan</title><desc id="desc">Sumber A: Jembatan dibuka pada 2010 di Desa Melati. Sumber B: Jembatan dibuka pada 2011 di Desa Melati. Tugas: Bandingkan kedua keterangan.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Dua ingatan tentang jembatan</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><rect x="6" y="12" width="106" height="66" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><polygon points="34,76 29,97 60,77" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="32" cy="43" r="5" fill="#2563eb"/><circle cx="59" cy="43" r="5" fill="#2563eb"/><circle cx="86" cy="43" r="5" fill="#2563eb"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Sumber A</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Jembatan dibuka pada 2010 di Desa</text><text x="184" y="189" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Melati.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><rect x="6" y="12" width="106" height="66" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><polygon points="34,76 29,97 60,77" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="32" cy="43" r="5" fill="#2563eb"/><circle cx="59" cy="43" r="5" fill="#25