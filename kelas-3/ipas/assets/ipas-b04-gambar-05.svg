<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">Percobaan kacang hijau</title><desc id="desc">Hasil hari keempat: empat biji kacang hijau tiap wadah. P kapas kering: nol berkecambah; Q kapas lembap: empat; R tergenang: satu. Jenis biji, suhu, tempat, dan waktu sama.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="620" rx="24" fill="#f0fdfa"/><text x="360" y="40" font-size="28" text-anchor="middle" fill="#17324d">Percobaan kacang hijau</text><rect x="30" y="85" width="170" height="60" rx="0" fill="#0f766e"/><text x="115" y="123" font-size="23" text-anchor="middle" fill="white">Wadah</text><rect x="200" y="85" width="245" height="60" rx="0" fill="#0f766e"/><text x="322.5" y="123" font-size="23" text-anchor="middle" fill="white">Keadaan kapas</text><rect x="445" y="85" width="245" height="60" rx="0" fill="#0f766e"/><text x="567.5" y="123" font-size="23" text-anchor="middle" fill="white">Berkecambah</text><rect x="30" y="147" width="168" height="93" rx="0" fill="#dcfce7"/><text x="115" y="185" font-size="24" text-anchor="middle" fill="#17324d">P</text><rect x="200" y="147" width="243" height="93" rx="0" fill="#dcfce7"/><text x="322.5" y="185" font-size="24" text-anchor="middle" fill="#17324d">Kering</text><rect x="445" y="147" width="243" height="93" rx="0" fill="#dcfce7"/><text x="567.5" y="185" font-size="24" text-anchor="middle" fill="#17324d">0 dari 4</text><rect x="30" y="242" width="168" height="93" rx="0" fill="#fff"/><text x="115" y="280" font-size="24" text-anchor="middle" fill="#17324d">Q</text><rect x="200" y="242" width="243" height="93" rx="0" fill="#fff"/><text x="322.5" y="280" font-size="24" text-anchor="middle" fill="#17324d">Lembap</text><rect x="445" y="242" width="243" height="93" rx="0" fill="#fff"/><text x="567.5" y="280" font-size="24" text-anchor="middle" fill="#17324d">4 dari 4</text><rect x="30" y="337" width="168" height="93" rx="0" fill="#dcfce7"/><text x="115" y="375" font-size="24" text-anchor="middle" fill="#17324d">R</text><rect x="200" y="337" width="243" height="93" rx="0" fill="#dcfce7"/><text x="322.5" y="375" font-size="24" text-anchor="middle" fill="#17324d">Tergenang</text><rect x="445" y="337" width="243" height="93" rx="0" fill="#dcfce7"/><text x="567.5" y="375" font-size="24" text-anchor="middle" fill="#17324d">1 dari 4</text><text x="40" y="490" font-size="24" text-anchor="start" fill="#17324d">Dicatat hari keempat. Jenis biji, jumlah</text><text x="40" y="521" font-size="24" text-anchor="start" fill="#17324d">biji, suhu, tempat, dan waktu sama.</text></g></svg>