<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Rencana uang hari ini</title><desc id="desc">Rencana uang Rp10.000: makan Rp4.000, alat tulis Rp3.000, tabungan Rp2.000, belum ditentukan Rp1.000.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Rencana uang hari ini</text><rect x="40" y="100" width="256" height="82" rx="0" fill="#60a5fa" stroke="none" stroke-width="3"/><rect x="296" y="100" width="192" height="82" rx="0" fill="#34d399" stroke="none" stroke-width="3"/><rect x="488" y="100" width="128" height="82" rx="0" fill="#fbbf24" stroke="none" stroke-width="3"/><rect x="616" y="100" width="64" height="82" rx="0" fill="#c4b5fd" stroke="none" stroke-width="3"/><rect x="40" y="221" width="35" height="35" rx="4" fill="#60a5fa" stroke="none" stroke-width="3"/><text x="100" y="250" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">Makan</text><text x="660" y="250" font-size="27" fill="#17324d" text-anchor="end" font-weight="500">Rp4.000</text><rect x="40" y="299" width="35" height="35" rx="4" fill="#34d399" stroke="none" stroke-width="3"/><text x="100" y="328" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">Alat tulis</text><text x="660" y="328" font-size="27" fill="#17324d" text-anchor="end" font-weight="500">Rp3.000</text><rect x="40" y="377" width="35" height="35" rx="4" fill="#fbbf24" stroke="none" stroke-width="3"/><text x="100" y="406" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">Tabungan</text><text x="660" y="406" font-size="27" fill="#17324d" text-anchor="end" font-weight="500">Rp2.000</text><rect x="40" y="455" width="35" height="35" rx="4" fill="#c4b5fd" stroke="none" stroke-width="3"/><text x="100" y="484" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">Belum ditentukan</text><text x="660" y="484" font-size="27" fill="#17324d" text-anchor="end" font-weight="500">Rp1.000</text><text x="360" y="637" font-size="25" fill="#17324d" text-anchor="middle" font-weight="500">Uang seluruhnya Rp10.000.</text></g></svg>