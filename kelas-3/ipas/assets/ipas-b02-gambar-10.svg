<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Lokasi di tepi lapangan</title><desc id="desc">Foto lama: Bangunan di tepi lapangan dipakai sebagai gudang. Foto baru: Bangunan di tempat yang sama menjadi perpustakaan. Catatan: Tahun perubahan fungsi belum diketahui.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Lokasi di tepi lapangan</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><polygon points="8,54 60,11 112,54" fill="#fb7185" stroke="#9f1239" stroke-width="3"/><rect x="21" y="54" width="78" height="59" rx="3" fill="#fef3c7" stroke="none" stroke-width="3"/><rect x="50" y="75" width="24" height="38" rx="2" fill="#b45309" stroke="none" stroke-width="3"/><rect x="28" y="66" width="15" height="18" rx="2" fill="#7dd3fc" stroke="none" stroke-width="3"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Foto lama</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Bangunan di tepi lapangan dipakai</text><text x="184" y="189" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">sebagai gudang.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><rect x="6" y="14" width="108" height="99" rx="4" fill="#b45309" stroke="none" stroke-width="3"/><rect x="12" y="21" width="96" height="36" rx="1" fill="#ffedd5" stroke="none" stroke-width="3"/><rect x="12" y="66" width="96" height="39" rx="1" fill="#ffedd5" stroke="none" stroke-width="3"/><rect x="18" y="29" width="13" height="27" rx="1" fill="#60a5fa" stroke="none" stroke-width="3"/><rect x="34" y="29" width="13" height="27" rx="1" fill="#fb7185" stroke="none" stroke-width="3"/><rect x="51" y="29" width="13" height="27" rx="1" fill="#34d399" stroke="none" stroke-width="3"/><rect x="70" y="29" width="13" height="27" rx="1" fill="#a78bfa" stroke="none" stroke-width="3"/><rect x="18" y="77" width="17" height="27" rx="1" fill="#fbbf24" stroke="none" stroke-width="3"/><rect x="39" y="77" width="17" height="27" rx="1" fill="#38bdf8" stroke="none" stroke-width="3"/><rect x="62" y="77" width="17" height="27" rx="1" fill="#fb7185" stroke="none" stroke-width="3"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Foto baru</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Bangunan di tempat yang sama</text><text x="184" y="369" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">menjadi perpustakaan.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><path d="M8 60 Q58 5 112 60 Q60 113 8 60 Z" fill="white" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="60" r="24" fill="#38bdf8"/><circle cx="60" cy="60" r="12" fill="#17324d"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Catatan</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Tahun perubahan fungsi belum</text><text x="184" y="549" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">diketahui.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>