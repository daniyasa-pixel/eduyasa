<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 3.3</title><desc id="d">Citra menyusun rencana gerak mingguan usia sekolah. Pilihan P: Membangun rata-rata sedikitnya 60 menit aktivitas sedang hingga berat per hari sepanjang minggu sesuai kemampuan. Pilihan Q: Menganggap harus langsung latihan berat 60 menit tanpa jeda.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 3.3</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Citra menyusun rencana gerak mingguan usia sekolah.</text><rect x="100" y="205" width="150" height="95" rx="10" fill="#dbeafe" stroke="#24334b" stroke-width="2"/><text x="175" y="260" font-size="22" text-anchor="middle" fill="#24334b">20 menit</text><rect x="280" y="205" width="150" height="95" rx="10" fill="#dbeafe" stroke="#24334b" stroke-width="2"/><text x="355" y="260" font-size="22" text-anchor="middle" fill="#24334b">20 menit</text><rect x="460" y="205" width="150" height="95" rx="10" fill="#dbeafe" stroke="#24334b" stroke-width="2"/><text x="535" y="260" font-size="22" text-anchor="middle" fill="#24334b">20 menit</text><text x="360" y="365" font-size="22" text-anchor="middle" fill="#24334b">Contoh pembagian waktu gerak</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Membangun rata-rata</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">sedikitnya 60 menit</text><text x="55" y="588" font-size="22" text-anchor="start" fill="#24334b">aktivitas sedang hingga</text><text x="55" y="617" font-size="22" text-anchor="start" fill="#24334b">berat per hari sepanjang</text><text x="55" y="646" font-size="22" text-anchor="start" fill="#24334b">minggu sesuai kemampuan</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Menganggap harus langsung</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">latihan berat 60 menit</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">tanpa jeda</text></g></svg>
