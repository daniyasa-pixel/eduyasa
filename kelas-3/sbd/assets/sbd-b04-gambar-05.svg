<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Mencoba susunan</title><desc id="desc">Di kiri potongan rumah bertumpuk; di kanan potongan tersusun menjadi rumah tetapi belum dilem.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="155" y="62" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#334155">KIRI</text><text x="485" y="62" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#334155">KANAN</text><g transform="translate(75 100) rotate(-10)"><rect width="140" height="105" fill="#fdba74"/><polygon points="0,0 70,-60 140,0" fill="#fca5a5"/><rect x="50" y="50" width="40" height="55" fill="#93c5fd"/></g><g transform="translate(360 100)"><rect x="25" y="80" width="180" height="135" fill="#fdba74" stroke="#c2410c" stroke-width="5"/><polygon points="10,80 115,0 220,80" fill="#fca5a5" stroke="#b91c1c" stroke-width="5"/><rect x="90" y="150" width="55" height="65" fill="#93c5fd" stroke="#1d4ed8" stroke-width="4"/></g></svg>