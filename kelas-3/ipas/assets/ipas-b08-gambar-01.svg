<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Air di dua wadah</title><desc id="desc">Air yang sama dipindahkan tanpa tumpah pada suhu sama: A gelas sempit berisi 200 mL dengan permukaan tinggi; B wadah lebar berisi 200 mL dengan permukaan lebih rendah.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Air di dua wadah</text><path d="M115 130 V430 H225 V130" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="118" y="230" width="104" height="198" rx="0" fill="#7dd3fc" stroke="none" stroke-width="3"/><text x="170" y="104" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">A</text><text x="170" y="480" font-size="27" fill="#17324d" text-anchor="middle" font-weight="500">200 mL</text><path d="M355 250 V430 H625 V250" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="358" y="350" width="264" height="78" rx="0" fill="#7dd3fc" stroke="none" stroke-width="3"/><text x="490" y="222" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">B</text><text x="490" y="480" font-size="27" fill="#17324d" text-anchor="middle" font-weight="500">200 mL</text><text x="38" y="560" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">Air dipindahkan tanpa tumpah; suhu sama.</text><text x="38" y="591" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">Perhatikan volume dan bentuk wadah.</text></g></svg>