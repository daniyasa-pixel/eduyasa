<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 3.9</title><desc id="d">Intan merasa pusing ketika bermain. Pilihan P: Berhenti di tempat aman dan segera memberi tahu guru. Pilihan Q: Menyembunyikan pusing agar terus bermain.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 3.9</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Intan merasa pusing ketika bermain.</text><polygon points="360,175 485,370 235,370" fill="#f5bf44" stroke="#24334b" stroke-width="2"/><text x="360" y="305" font-size="70" text-anchor="middle" fill="#24334b">!</text><text x="360" y="405" font-size="22" text-anchor="middle" fill="#24334b">Keluhan? Berhenti dan laporkan</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Berhenti di tempat aman</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">dan segera memberi tahu</text><text x="55" y="588" font-size="22" text-anchor="start" fill="#24334b">guru</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Menyembunyikan pusing</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">agar terus bermain</text></g></svg>
