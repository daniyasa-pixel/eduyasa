<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 204" role="img" aria-labelledby="title desc">
<title id="title">Room guessing game</title><desc id="desc">clue: books and quiet reading. question: Is it the library?. answer: Yes, it is.</desc>
