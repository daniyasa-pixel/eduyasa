<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 5.10</title><desc id="d">Joko menemukan tali melintang di jalur latihan. Pilihan P: Membiarkan teman berikutnya tersandung. Pilihan Q: Memberi tahu guru dan menghindari jalur sampai aman.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 5.10</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Joko menemukan tali melintang di jalur latihan.</text><polygon points="200,200 165,320 235,320" fill="#f28b45" stroke="#24334b" stroke-width="2"/><polygon points="360,200 325,320 395,320" fill="#f28b45" stroke="#24334b" stroke-width="2"/><polygon points="520,200 485,320 555,320" fill="#f28b45" stroke="#24334b" stroke-width="2"/><line x1="180" y1="330" x2="550" y2="245" stroke="#24334b" stroke-width="5"/><text x="360" y="395" font-size="22" text-anchor="middle" fill="#24334b">Periksa hambatan pada jalur</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Membiarkan teman</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">berikutnya tersandung</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Memberi tahu guru dan</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">menghindari jalur sampai</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">aman</text></g></svg>
