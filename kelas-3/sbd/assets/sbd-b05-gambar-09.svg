<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Contoh awal dan hasil modifikasi ikan</title><desc id="desc">Contoh awal adalah ikan polos dengan ekor kecil. Hasil modifikasi memiliki pola pada sirip dan ekor lebih lebar.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="170" y="60" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#0f172a">CONTOH AWAL</text><ellipse cx="155" cy="180" rx="75" ry="42" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/><polygon points="220,180 260,150 260,210" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/><circle cx="125" cy="168" r="6" fill="#0f172a"/><path d="M295 180 H345 l-12 -10 m12 10 l-12 10" fill="none" stroke="#475569" stroke-width="4"/><text x="475" y="60" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#0f172a">HASIL MODIFIKASI</text><ellipse cx="455" cy="180" rx="78" ry="44" fill="#fda4af" stroke="#be123c" stroke-width="3"/><polygon points="520,180 590,125 590,235" fill="#fb7185" stroke="#be123c" stroke-width="3"/><polygon points="430,140 465,100 490,148" fill="#fecdd3" stroke="#be123c" stroke-width="3"/><circle cx="425" cy="167" r="6" fill="#0f172a"/><path d="M440 125 l12 18 12 -18 12 18" fill="none" stroke="#be123c" stroke-width="4"/></svg>