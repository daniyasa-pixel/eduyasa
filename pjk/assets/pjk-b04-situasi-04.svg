<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 4.4</title><desc id="d">Danu menyusun piring makan yang lebih beragam. Pilihan P: Menganggap warna permen menggantikan semua manfaat buah. Pilihan Q: Menambahkan sayur dan buah yang aman serta layak makan.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 4.4</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Danu menyusun piring makan yang lebih beragam.</text><g transform="translate(220 280) scale(1.0)"><path d="M 0 50 C -60 15 -48 -50 0 -70 C 48 -50 60 15 0 50" fill="#0d9488" stroke="#24334b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="45" x2="0" y2="-55" stroke="#fffdf8" stroke-width="3"/><path d="M 0 10 L -23 -12 M 0 -10 L 25 -32" fill="none" stroke="#fffdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="440" cy="280" r="70" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="360" y="395" font-size="23" text-anchor="middle" fill="#24334b">Sayur dan buah beragam</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Menganggap warna permen</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">menggantikan semua</text><text x="55" y="588" font-size="22" text-anchor="start" fill="#24334b">manfaat buah</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Menambahkan sayur dan</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">buah yang aman serta</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">layak makan</text></g></svg>
