<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 710" role="img" aria-labelledby="title desc"><title id="title">Uji cahaya pada panel</title><desc id="desc">Uji lampu model bertenaga panel surya tanpa baterai: A panel terkena cahaya, lampu menyala; B panel ditutup rapat dari cahaya, lampu padam. Alat sama, penutup aman ditangani guru.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="710" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Uji cahaya pada panel</text><rect x="24" y="90" width="672" height="210" rx="18" fill="white" stroke="none" stroke-width="3"/><text x="48" y="125" font-size="29" fill="#17324d" text-anchor="start" font-weight="750">A</text><g transform="translate(105 120)"><path d="M15 15 L103 15 L113 83 L5 83 Z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 16 L39 82 M74 16 L78 82 M10 48 L108 48 M60 84 L60 113 M35 113 L87 113" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M78 125 L105 153 M74 165 L99 178" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(285 117)"><circle cx="60" cy="43" r="30" fill="#fde047"/><path d="M44 68 L44 90 L77 90 L77 68" fill="#cbd5e1" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 98 L76 98 M51 106 L69 106" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="430" y="143" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Panel terkena</text><text x="430" y="174" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">cahaya; lampu</text><text x="430" y="205" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">menyala.</text><rect x="24" y="330" width="672" height="210" rx="18" fill="white" stroke="none" stroke-width="3"/><text x="48" y="365" font-size="29" fill="#17324d" text-anchor="start" font-weight="750">B</text><g transform="translate(105 360)"><path d="M15 15 L103 15 L113 83 L5 83 Z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 16 L39 82 M74 16 L78 82 M10 48 L108 48 M60 84 L60 113 M35 113 L87 113" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="115" y="371" width="112" height="80" rx="4" fill="#334155" stroke="none" stroke-width="3"/><g transform="translate(285 357)"><circle cx="60" cy="43" r="30" fill="#cbd5e1"/><path d="M44 68 L44 90 L77 90 L77 68" fill="#cbd5e1" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 98 L76 98 M51 106 L69 106" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="430" y="383" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Panel tertutup</text><text x="430" y="414" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">dari cahaya;</text><text x="430" y="445" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">lampu padam.</text><text x="38" y="610" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Model tanpa baterai. Alat sama; penutup aman</text><text x="38" y="641" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">ditangani guru.</text></g></svg>