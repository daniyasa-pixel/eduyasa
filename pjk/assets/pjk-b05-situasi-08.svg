<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 5.8</title><desc id="d">Hana diminta memberi laporan kepada guru. Pilihan P: Mengarang diagnosis pasti. Pilihan Q: Menyebut lokasi kejadian apa yang terlihat dan bahaya di sekitar.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 5.8</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Hana diminta memberi laporan kepada guru.</text><rect x="190" y="190" width="340" height="175" rx="10" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><line x1="230" y1="315" x2="480" y2="225" stroke="#0d9488" stroke-width="8"/><circle cx="365" cy="263" r="25" fill="#e85d5d" stroke="#24334b" stroke-width="2"/><text x="360" y="400" font-size="22" text-anchor="middle" fill="#24334b">Sampaikan lokasi dan keadaan</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Mengarang diagnosis pasti</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Menyebut lokasi kejadian</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">apa yang terlihat dan</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">bahaya di sekitar</text></g></svg>
