<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Bandingkan nilai uang</title><desc id="desc">Kartu nilai uang mainan: kelompok A satu kartu Rp5.000; kelompok B dua kartu masing-masing Rp2.000. Baca nominal, bukan jumlah kartu.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Bandingkan nilai uang</text><text x="50" y="106" font-size="30" fill="#17324d" text-anchor="start" font-weight="750">A</text><rect x="120" y="130" width="240" height="100" rx="13" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="240" y="161" font-size="18" fill="#17324d" text-anchor="middle" font-weight="500">KARTU NILAI</text><text x="240" y="202" font-size="30" fill="#17324d" text-anchor="middle" font-weight="750">Rp5.000</text><text x="50" y="325" font-size="30" fill="#17324d" text-anchor="start" font-weight="750">B</text><rect x="120" y="350" width="240" height="100" rx="13" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="240" y="381" font-size="18" fill="#17324d" text-anchor="middle" font-weight="500">KARTU NILAI</text><text x="240" y="422" font-size="30" fill="#17324d" text-anchor="middle" font-weight="750">Rp2.000</text><rect x="400" y="350" width="240" height="100" rx="13" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="520" y="381" font-size="18" fill="#17324d" text-anchor="middle" font-weight="500">KARTU NILAI</text><text x="520" y="422" font-size="30" fill="#17324d" text-anchor="middle" font-weight="750">Rp2.000</text><text x="38" y="535" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">Uang mainan: nilai disederhanakan untuk</text><text x="38" y="566" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">belajar. Baca nominal setiap kartu.</text></g></svg>