<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Pilihan latihan pemula</title><desc id="desc">Pilihan A bola lunak tiga meter dan pilihan B bola keras enam meter</desc><rect width="720" height="400" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:20px;font-weight:700}.s{font-size:16px}.line{stroke:#2563eb;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#7c3aed;stroke-width:5;fill:none;stroke-dasharray:12 10}.ball{fill:#f59e0b;stroke:#92400e;stroke-width:3}.person{fill:#bfdbfe;stroke:#1d4ed8;stroke-width:4}.safe{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.warn{fill:#fee2e2;stroke:#dc2626;stroke-width:3}</style><text class="h" x="30" y="42">Pilih pengaturan awal</text><rect class="safe" x="45" y="75" width="290" height="270" rx="20"/><text class="l" x="165" y="112">A</text><circle class="ball" cx="120" cy="205" r="35"/><text class="s" x="190" y="195">bola lunak</text><text class="s" x="190" y="225">jarak 3 m</text><rect class="warn" x="385" y="75" width="290" height="270" rx="20"/><text class="l" x="505" y="112">B</text><circle fill="#64748b" stroke="#1e293b" stroke-width="3" cx="460" cy="205" r="23"/><text class="s" x="520" y="195">bola keras</text><text class="s" x="520" y="225">jarak 6 m</text></svg>