<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Pilihan dan alasan</title><desc id="desc">NINA: Taman nyaman karena teduh. DENGARKAN: Pilihan teman boleh berbeda. YUDI: Kelas nyaman karena ada meja.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Pilihan dan alasan</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><rect x="52" y="65" width="15" height="48" rx="3" fill="#a16207" stroke="none" stroke-width="3"/><circle cx="60" cy="38" r="30" fill="#34d399"/><circle cx="32" cy="52" r="25" fill="#10b981"/><circle cx="87" cy="51" r="26" fill="#059669"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">NINA</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Taman nyaman karena teduh.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><rect x="6" y="12" width="106" height="66" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><polygon points="34,76 29,97 60,77" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="32" cy="43" r="5" fill="#2563eb"/><circle cx="59" cy="43" r="5" fill="#2563eb"/><circle cx="86" cy="43" r="5" fill="#2563eb"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">DENGARKAN</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Pilihan teman boleh berbeda.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><rect x="8" y="49" width="104" height="15" rx="5" fill="#b45309" stroke="none" stroke-width="3"/><rect x="19" y="64" width="9" height="48" rx="2" fill="#92400e" stroke="none" stroke-width="3"/><rect x="92" y="64" width="9" height="48" rx="2" fill="#92400e" stroke="none" stroke-width="3"/><rect x="39" y="30" width="40" height="18" rx="3" fill="#38bdf8" stroke="none" stroke-width="3"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">YUDI</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Kelas nyaman karena ada meja.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>