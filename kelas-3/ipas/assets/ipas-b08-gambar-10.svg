<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc"><title id="title">Ditimbang sebelum dan sesudah</title><desc id="desc">Kantong yang sama ditutup rapat tanpa bocor. Penimbangan bersama kantong: A sebelum, es padat, 30 g; B sesudah, air cair, 30 g. Gambar tidak mengukur volume.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="720" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Ditimbang sebelum dan sesudah</text><text x="175" y="120" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">A</text><rect x="100" y="160" width="150" height="220" rx="15" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><path d="M107 181 H243" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="104" y="280" width="142" height="94" rx="4" fill="#dbeafe" stroke="#0284c7" stroke-width="3"/><rect x="80" y="390" width="190" height="75" rx="10" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><text x="175" y="440" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">30 g</text><text x="175" y="510" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Sebelum: es padat.</text><text x="520" y="120" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">B</text><rect x="445" y="160" width="150" height="220" rx="15" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><path d="M452 181 H588" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="449" y="295" width="142" height="81" rx="5" fill="#7dd3fc" stroke="none" stroke-width="3"/><rect x="425" y="390" width="190" height="75" rx="10" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><text x="520" y="440" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">30 g</text><text x="520" y="510" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Sesudah: air cair.</text><text x="38" y="595" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Kantong sama, tetap tertutup, tidak bocor.</text><text x="38" y="626" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Ditimbang bersama kantong; bukan ukuran volume.</text></g></svg>