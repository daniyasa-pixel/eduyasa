<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Daftar kesiapan latihan</title><desc id="desc">Daftar menunjukkan guru hadir, zona dangkal, jalur kosong, dan seorang siswa demam.</desc>
<rect width="640" height="360" rx="24" fill="#eef8ff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#2474a6" stroke-width="3"/>
<text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">Daftar kesiapan kelompok</text><circle cx="135" cy="110" r="17" fill="#dff2df" stroke="#34723a" stroke-width="3"/><text x="135" y="117" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#34723a">✓</text><text x="170" y="117" font-family="sans-serif" font-size="21" fill="#16324f">Guru hadir</text><circle cx="135" cy="162" r="17" fill="#dff2df" stroke="#34723a" stroke-width="3"/><text x="135" y="169" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#34723a">✓</text><text x="170" y="169" font-family="sans-serif" font-size="21" fill="#16324f">Zona dangkal ditetapkan</text><circle cx="135" cy="214" r="17" fill="#dff2df" stroke="#34723a" stroke-width="3"/><text x="135" y="221" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#34723a">✓</text><text x="170" y="221" font-family="sans-serif" font-size="21" fill="#16324f">Jalur latihan kosong</text><circle cx="135" cy="266" r="17" fill="#ffd9d7" stroke="#b43b3b" stroke-width="3"/><text x="135" y="273" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#b43b3b">!</text><text x="170" y="273" font-family="sans-serif" font-size="21" fill="#16324f">Satu siswa demam</text><text x="320" y="326" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Apakah semua siswa boleh masuk air?</text>
</svg>