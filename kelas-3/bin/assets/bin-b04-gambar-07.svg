<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Musang belajar berbagi</title><desc id="desc">AWAL: Musang menyimpan semua buah. MASALAH: Dahan patah; sulit memetik. AKHIR: Musang meminta bantuan dan berbagi.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Musang belajar berbagi</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><circle cx="43" cy="62" r="26" fill="#fb7185"/><circle cx="83" cy="67" r="26" fill="#fbbf24"/><path d="M43 38 Q42 18 56 13 M83 43 L87 21" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">AWAL</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Musang menyimpan semua buah.</text><path d="M670 247 L670 261 M662 255 L670 262 L678 255" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><path d="M14 101 L57 55 M66 47 L107 13 M38 76 L19 45 M84 31 L103 55" fill="none" stroke="#92400e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M51 46 L66 60 M55 40 L72 52" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">MASALAH</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Dahan patah; sulit memetik.</text><path d="M670 427 L670 441 M662 435 L670 442 L678 435" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><path d="M32 101 L22 62 Q22 52 31 57 L42 72 L42 21 Q42 10 51 18 L53 52 L56 13 Q58 4 66 15 L67 53 L73 20 Q80 13 84 23 L82 60 L92 36 Q101 31 104 41 L92 94 Q86 112 61 112 L44 111 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">AKHIR</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Musang meminta bantuan dan</text><text x="184" y="549" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">berbagi.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>