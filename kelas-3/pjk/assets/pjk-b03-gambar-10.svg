<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Hasil oper dan tahan</title><desc id="desc">Tabel tiga percobaan dengan hasil enam, delapan, dan sembilan</desc><rect width="720" height="400" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:20px;font-weight:700}.s{font-size:16px}.line{stroke:#2563eb;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#7c3aed;stroke-width:5;fill:none;stroke-dasharray:12 10}.ball{fill:#f59e0b;stroke:#92400e;stroke-width:3}.person{fill:#bfdbfe;stroke:#1d4ed8;stroke-width:4}.safe{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.warn{fill:#fee2e2;stroke:#dc2626;stroke-width:3}</style><text class="h" x="30" y="42">Oper–tahan berhasil</text><rect x="110" y="85" width="500" height="240" fill="#fff" stroke="#64748b" stroke-width="4"/><line x1="110" y1="145" x2="610" y2="145" stroke="#64748b" stroke-width="3"/><line x1="300" y1="85" x2="300" y2="325" stroke="#64748b" stroke-width="3"/><line x1="110" y1="205" x2="610" y2="205" stroke="#cbd5e1" stroke-width="2"/><line x1="110" y1="265" x2="610" y2="265" stroke="#cbd5e1" stroke-width="2"/><text class="l" x="150" y="125">Percobaan</text><text class="l" x="420" y="125">Berhasil</text><text class="s" x="190" y="185">1</text><text class="l" x="465" y="185">6</text><text class="s" x="190" y="245">2</text><text class="l" x="465" y="245">8</text><text class="s" x="190" y="305">3</text><text class="l" x="465" y="305">9</text></svg>