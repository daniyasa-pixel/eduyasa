<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 3.8</title><desc id="d">Hana membawa air minum saat kegiatan luar ruang. Pilihan P: Menunggu sangat kehausan sebelum boleh minum. Pilihan Q: Minum air secara berkala dan mengikuti pengaturan guru.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 3.8</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Hana membawa air minum saat kegiatan luar ruang.</text><rect x="280" y="195" width="100" height="170" rx="18" fill="#bfdbfe" stroke="#24334b" stroke-width="2"/><rect x="298" y="175" width="64" height="25" rx="4" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="480" y="280" font-size="25" text-anchor="middle" fill="#24334b">Air minum</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Menunggu sangat kehausan</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">sebelum boleh minum</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Minum air secara berkala</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">dan mengikuti pengaturan</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">guru</text></g></svg>
