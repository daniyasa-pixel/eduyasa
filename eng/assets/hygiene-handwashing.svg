<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" rx="28" fill="#eff6ff"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#1e40af">FIVE STEPS TO WASH HANDS</text><g font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e3a8a"><g transform="translate(70 110)"><circle cx="90" cy="70" r="55" fill="#bfdbfe"/><path d="M60 85 Q50 45 75 35 L85 60 L100 35 Q120 35 115 65 L110 100Z" fill="#fbbf24"/><text x="90" y="165">1. Wet</text><text x="90" y="195" font-size="17">your hands</text></g><g transform="translate(245 110)"><circle cx="90" cy="70" r="55" fill="#bfdbfe"/><path d="M50 80 Q90 25 130 80" fill="none" stroke="#2563eb" stroke-width="15" stroke-linecap="round"/><circle cx="90" cy="45" r="9" fill="#fff"/><text x="90" y="165">2. Soap</text><text x="90" y="195" font-size="17">your hands</text></g><g transform="translate(420 110)"><circle cx="90" cy="70" r="55" fill="#bfdbfe"/><path d="M45 70 Q90 30 135 70 M45 90 Q90 130 135 90" fill="none" stroke="#2563eb" stroke-width="13" stroke-linecap="round"/><text x="90" y="165">3. Scrub</text><text x="90" y="195" font-size="17">for 20 seconds</text></g><g transform="translate(595 110)"><circle cx="90" cy="70" r="55" fill="#bfdbfe"/><path d="M45 45 Q90 95 135 45 M45 95 Q90 45 135 95" fill="none" stroke="#0ea5e9" stroke-width="13" stroke-linecap="round"/><text x="90" y="165">4. Rinse</text><text x="90" y="195" font-size="17">with clean water</text></g><g transform="translate(770 110)"><circle cx="0" cy="70" r="55" fill="#bfdbfe"/><path d="M-25 55 Q0 25 25 55 L20 105 L-20 105Z" fill="#fbbf24"/><text x="0" y="165">5. Dry</text><text x="0" y="195" font-size="17">your hands</text></g></g><text x="450" y="475" text-anchor="middle" font-family="Arial" font-size="21" fill="#1e40af">Use clean water and soap</text></svg>