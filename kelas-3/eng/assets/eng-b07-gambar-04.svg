<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc"><title id="title">Canteen between library and office</title><desc id="desc">Three school rooms in a row with the canteen in the middle.</desc><rect width="400" height="240" rx="20" fill="#fff7ed"/><g font-family="sans-serif" text-anchor="middle" font-weight="bold"><rect x="15" y="65" width="110" height="115" rx="8" fill="#ddd6fe" stroke="#6d28d9" stroke-width="4"/><text x="70" y="125" font-size="17" fill="#4c1d95">LIBRARY</text><rect x="145" y="45" width="110" height="145" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="5"/><text x="200" y="120" font-size="18" fill="#78350f">CANTEEN</text><rect x="275" y="65" width="110" height="115" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4"/><text x="330" y="125" font-size="18" fill="#1e3a8a">OFFICE</text><text x="200" y="220" font-size="20" fill="#9a3412">between</text></g></svg>
