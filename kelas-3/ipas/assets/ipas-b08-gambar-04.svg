<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 765" role="img" aria-labelledby="title desc"><title id="title">Baca arah perubahan</title><desc id="desc">Enam panah berlabel: A padat ke cair, B cair ke padat, C cair ke gas, D gas ke cair, E padat ke gas, F gas ke padat. Semua panah menyatakan perubahan langsung.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="765" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Baca arah perubahan</text><rect x="30" y="78" width="660" height="82" rx="12" fill="#dcfce7" stroke="none" stroke-width="3"/><text x="60" y="129" font-size="28" fill="#17324d" text-anchor="start" font-weight="750">A</text><text x="370" y="129" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">Padat → Cair</text><rect x="30" y="178" width="660" height="82" rx="12" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="60" y="229" font-size="28" fill="#17324d" text-anchor="start" font-weight="750">B</text><text x="370" y="229" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">Cair → Padat</text><rect x="30" y="278" width="660" height="82" rx="12" fill="#dcfce7" stroke="none" stroke-width="3"/><text x="60" y="329" font-size="28" fill="#17324d" text-anchor="start" font-weight="750">C</text><text x="370" y="329" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">Cair → Gas</text><rect x="30" y="378" width="660" height="82" rx="12" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="60" y="429" font-size="28" fill="#17324d" text-anchor="start" font-weight="750">D</text><text x="370" y="429" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">Gas → Cair</text><rect x="30" y="478" width="660" height="82" rx="12" fill="#dcfce7" stroke="none" stroke-width="3"/><text x="60" y="529" font-size="28" fill="#17324d" text-anchor="start" font-weight="750">E</text><text x="370" y="529" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">Padat → Gas</text><rect x="30" y="578" width="660" height="82" rx="12" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="60" y="629" font-size="28" fill="#17324d" text-anchor="start" font-weight="750">F</text><text x="370" y="629" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">Gas → Padat</text><text x="360" y="729" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">Panah menyatakan perubahan langsung.</text></g></svg>