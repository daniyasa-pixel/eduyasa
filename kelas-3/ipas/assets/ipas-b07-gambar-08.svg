white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="185" y="555" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Sungai.</text><rect x="390" y="350" width="290" height="235" rx="17" fill="white" stroke="none" stroke-width="3"/><text x="412" y="385" font-size="28" fill="#17324d" text-anchor="start" font-weight="750">D</text><g transform="translate(475 395)"><rect x="12" y="42" width="96" height="65" rx="2" fill="#fef3c7" stroke="#a16207" stroke-width="3"/><path d="M4 42 L60 9 L116 42 Z" fill="#fb7185" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="23" y="55" width="20" height="20" rx="1" fill="#38bdf8" stroke="none" stroke-width="3"/><rect x="77" y="55" width="20" height="20" rx="1" fill="#38bdf8" stroke="none" stroke-width="3"/><rect x="49" y="73" width="22" height="34" rx="1" fill="#b45309" stroke="none" stroke-width="3"/><text x="60" y="64" font-size="14" fill="#17324d" text-anchor="middle" font-weight="500">SD</text></g><text x="535" y="555" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Sekolah.</text><text x="360" y="655" font-size="22" fill="#17324d" text-anchor="middle" font-weight="500">Gambar skematis suatu lingkungan.</text></g></svg>