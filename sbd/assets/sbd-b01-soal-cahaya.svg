<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Cahaya pada bola</title><desc id="desc">Cahaya datang dari kiri atas. Bola terlihat lebih terang di kiri atas dan gelap di kanan bawah.</desc><rect x="1" y="1" width="718" height="478" rx="20" fill="#fffdf8" stroke="#dce5ef" stroke-width="2"/><g font-family="Arial, sans-serif"><circle cx="35" cy="35" r="13" fill="#f5bf44" stroke="#24334b" stroke-width="2"/><text x="65" y="44" font-size="24" text-anchor="start" fill="#24334b">Cahaya pada bola</text><defs><radialGradient id="ball" cx="24%" cy="25%"><stop offset="0" stop-color="#fff7dc"/><stop offset=".5" stop-color="#f6c85f"/><stop offset="1" stop-color="#936036"/></radialGradient></defs><circle cx="135" cy="130" r="36" fill="#f5bf44" stroke="#24334b" stroke-width="2"/><line x1="180" y1="150" x2="235" y2="184" stroke="#f28b45" stroke-width="5"/><polygon points="235,184 216,179 224,167" fill="#f28b45" stroke="#24334b" stroke-width="2"/><ellipse cx="383" cy="357" rx="130" ry="22" fill="#cbd5e1" transform="rotate(0 383 357)"/><circle cx="360" cy="245" r="110" fill="url(#ball)" stroke="#24334b" stroke-width="2"/><text x="130" y="85" font-size="22" text-anchor="middle" fill="#24334b">Cahaya</text></g></svg>
