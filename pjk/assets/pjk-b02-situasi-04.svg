<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 2.4</title><desc id="d">Danu memiliki anggota tim dengan kemampuan gerak berbeda. Pilihan P: Mengeluarkan teman yang baru belajar. Pilihan Q: Menyepakati penyesuaian peran dan alat agar semua terlibat.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 2.4</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Danu memiliki anggota tim dengan kemampuan gerak</text><text x="40" y="114" font-size="22" text-anchor="start" fill="#24334b">berbeda.</text><rect x="65" y="160" width="590" height="240" rx="8" fill="#dcfce7" stroke="#24334b" stroke-width="2"/><line x1="360" y1="165" x2="360" y2="395" stroke="#fff" stroke-width="3"/><circle cx="360" cy="280" r="65" fill="#bbf7d0" stroke="#24334b" stroke-width="2"/><circle cx="180" cy="220" r="24" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="180" y="227" font-size="22" text-anchor="middle" fill="#fff">1</text><circle cx="490" cy="320" r="24" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="490" y="327" font-size="22" text-anchor="middle" fill="#fff">2</text><circle cx="430" cy="220" r="24" fill="#e85d5d" stroke="#24334b" stroke-width="2"/><text x="430" y="227" font-size="22" text-anchor="middle" fill="#fff">3</text><line x1="215" y1="225" x2="455" y2="310" stroke="#f28b45" stroke-width="5"/><polygon points="470,317 444,315 455,296" fill="#f28b45" stroke="#24334b" stroke-width="2"/><circle cx="300" cy="265" r="12" fill="#f5bf44" stroke="#24334b" stroke-width="2"/><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Mengeluarkan teman yang</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">baru belajar</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Menyepakati penyesuaian</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">peran dan alat agar semua</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">terlibat</text></g></svg>
