<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 5.9</title><desc id="d">Intan melihat teman kesulitan di kolam. Pilihan P: Memanggil penjaga atau orang dewasa dan tidak melompat menolong sendiri. Pilihan Q: Melompat meski tidak terlatih.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 5.9</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Intan melihat teman kesulitan di kolam.</text><rect x="120" y="225" width="480" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M140 260 Q220 235 300 260 T570 260" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 300 Q220 275 300 300 T570 300" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 340 Q220 315 300 340 T570 340" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="195" font-size="22" text-anchor="middle" fill="#24334b">Panggil penjaga / orang dewasa</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Memanggil penjaga atau</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">orang dewasa dan tidak</text><text x="55" y="588" font-size="22" text-anchor="start" fill="#24334b">melompat menolong sendiri</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Melompat meski tidak</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">terlatih</text></g></svg>
