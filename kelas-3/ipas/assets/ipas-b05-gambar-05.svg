<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Bandingkan buku yang sama</title><desc id="desc">Toko A satu buku tulis 40 halaman Rp4.000. Toko B satu buku tulis 40 halaman Rp3.500. Jenis, ukuran, kualitas buku sama dan biaya perjalanan diabaikan.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="460" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Bandingkan buku yang sama</text><rect x="30" y="80" width="270" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="165.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Toko</text><rect x="300" y="80" width="390" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="495.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Harga satu buku</text><rect x="30" y="142" width="268" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="165.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">A</text><rect x="300" y="142" width="388" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="495.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Rp4.000</text><rect x="30" y="242" width="268" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="165.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">B</text><rect x="300" y="242" width="388" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="495.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Rp3.500</text><text x="38" y="383" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Sama-sama 40 halaman; jenis, ukuran, kualitas</text><text x="38" y="414" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">sama. Biaya perjalanan diabaikan.</text></g></svg>