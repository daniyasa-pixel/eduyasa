<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Rute rumah ke sekolah</title><desc id="desc">Denah utara di atas. Rute berpanah A rumah di kiri bawah ke B toko di kanan bawah, lalu ke C sekolah di kanan atas. Jalan berbentuk siku, tidak berskala.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Rute rumah ke sekolah</text><path d="M150 475 H550 V180" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 461 L360 475 L340 489 M536 340 L550 320 L564 340" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="443" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="150" y="483" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">A Rumah</text><rect x="460" y="443" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="550" y="483" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">B Toko</text><rect x="460" y="148" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="550" y="188" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">C Sekolah</text><circle cx="145" cy="180" r="70" fill="white"/><text x="145" y="132" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">U</text><text x="200" y="187" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">T</text><text x="145" y="242" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">S</text><text x="90" y="187" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">B</text><path d="M145 180 L145.0 145.35" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="615" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">Ikuti jalan yang digambar; tidak berskala.</text></g></svg>