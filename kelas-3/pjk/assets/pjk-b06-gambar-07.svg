<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Posisi tubuh saat meluncur</title><desc id="desc">Gambar A menunjukkan tubuh lurus sejajar air; gambar B pinggul turun dan lutut menekuk.</desc>
<rect width="640" height="360" rx="24" fill="#eef8ff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#2474a6" stroke-width="3"/>
