<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 710" role="img" aria-labelledby="title desc"><title id="title">Dari mana titik air?</title><desc id="desc">Dua gelas tertutup utuh, bagian luar awalnya kering. A berisi air es dan kemudian bertitik air di luar; B berisi air suhu ruang dan bagian luar tetap kering pada pengamatan. Gelas sama jenis dan waktu pengamatan sama.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="710" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Dari mana titik air?</text><path d="M120 155 V445 H270 V155" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="123" y="265" width="144" height="178" rx="0" fill="#7dd3fc" stroke="none" stroke-width="3"/><path d="M108 152 H282" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="115" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">A</text><rect x="150" y="330" width="34" height="34" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><rect x="205" y="360" width="34" height="34" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><circle cx="112" cy="250" r="7" fill="#38bdf8"/><circle cx="277" cy="290" r="7" fill="#38bdf8"/><circle cx="112" cy="370" r="7" fill="#38bdf8"/><circle cx="277" cy="400" r="7" fill="#38bdf8"/><text x="195" y="485" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Air es; luar</text><text x="195" y="516" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">bertitik air.</text><path d="M450 155 V445 H600 V155" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="453" y="265" width="144" height="178" rx="0" fill="#7dd3fc" stroke="none" stroke-width="3"/><path d="M438 152 H612" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="525" y="115" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">B</text><text x="525" y="485" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Air suhu ruang;</text><text x="525" y="516" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">luar tetap kering.</text><text x="38" y="600" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Gelas tertutup, utuh, awal luar kering; jenis</text><text x="38" y="631" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">gelas dan waktu sama.</text></g></svg>