<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Rotasi tiga peran</title><desc id="desc">Pengumpan, penendang, dan penjaga gawang bertukar peran</desc><rect width="720" height="400" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:20px;font-weight:700}.s{font-size:16px}.line{stroke:#2563eb;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#7c3aed;stroke-width:5;fill:none;stroke-dasharray:12 10}.ball{fill:#f59e0b;stroke:#92400e;stroke-width:3}.person{fill:#bfdbfe;stroke:#1d4ed8;stroke-width:4}.safe{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.warn{fill:#fee2e2;stroke:#dc2626;stroke-width:3}</style><text class="h" x="30" y="42">Rotasi peran</text><circle class="person" cx="170" cy="210" r="65"/><circle class="person" cx="360" cy="110" r="65"/><circle class="person" cx="550" cy="210" r="65"/><text class="s" x="125" y="215">pengumpan</text><text class="s" x="325" y="115">penendang</text><text class="s" x="500" y="215">penjaga</text><path class="dash" d="M230 175 Q290 105 300 105"/><path class="dash" d="M420 115 Q500 135 520 155"/><path class="dash" d="M500 260 Q320 360 205 265"/></svg>