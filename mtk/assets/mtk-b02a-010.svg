<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Perjalanan berkecepatan tetap</title><desc id="desc">Tabel perjalanan sepeda: 10 menit 2 km; 20 menit 4 km; jarak 25 menit belum diketahui.</desc><rect width="640" height="400" rx="16" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="24" text-anchor="middle" fill="#172033">Perjalanan berkecepatan tetap</text><rect x="40.0" y="75" width="280.0" height="55" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="180.0" y="110" font-size="20" text-anchor="middle" fill="#172033">Waktu (menit)</text><rect x="320.0" y="75" width="280.0" height="55" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="460.0" y="110" font-size="20" text-anchor="middle" fill="#172033">Jarak (km)</text><rect x="40.0" y="130" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="180.0" y="165" font-size="20" text-anchor="middle" fill="#172033">10</text><rect x="320.0" y="130" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="460.0" y="165" font-size="20" text-anchor="middle" fill="#172033">2</text><rect x="40.0" y="185" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="180.0" y="220" font-size="20" text-anchor="middle" fill="#172033">20</text><rect x="320.0" y="185" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="460.0" y="220" font-size="20" text-anchor="middle" fill="#172033">4</text><rect x="40.0" y="240" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="180.0" y="275" font-size="20" text-anchor="middle" fill="#172033">25</text><rect x="320.0" y="240" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="460.0" y="275" font-size="20" text-anchor="middle" fill="#172033">?</text></g></svg>
