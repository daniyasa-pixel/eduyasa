<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Urutan mencuci tangan</title><desc id="desc">Lima tahap: basahi, sabun, gosok, bilas, keringkan; pertanyaan menanyakan tahap setelah sabun.</desc><rect width="640" height="360" rx="24" fill="#f6fbff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#287da8" stroke-width="3"/><text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">Urutan cuci tangan</text><circle cx="90" cy="165" r="42" fill="#dbeafe" stroke="#287da8" stroke-width="3"/><text x="90" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">Basahi</text><path d="M132 165h28m-10-10l10 10-10 10" stroke="#287da8" stroke-width="4" fill="none"/><circle cx="205" cy="165" r="42" fill="#dbeafe" stroke="#287da8" stroke-width="3"/><text x="205" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">Sabun</text><path d="M132 165h28m-10-10l10 10-10 10" stroke="#287da8" stroke-width="4" fill="none"/><circle cx="320" cy="165" r="42" fill="#fef3c7" stroke="#287da8" stroke-width="3"/><text x="320" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">Gosok</text><path d="M132 165h28m-10-10l10 10-10 10" stroke="#287da8" stroke-width="4" fill="none"/><circle cx="435" cy="165" r="42" fill="#dbeafe" stroke="#287da8" stroke-width="3"/><text x="435" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">Bilas</text><path d="M132 165h28m-10-10l10 10-10 10" stroke="#287da8" stroke-width="4" fill="none"/><circle cx="550" cy="165" r="42" fill="#dbeafe" stroke="#287da8" stroke-width="3"/><text x="550" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">Keringkan</text><text x="320" y="290" text-anchor="middle" font-family="sans-serif" font-size="19">Setelah sabun?</text></svg>