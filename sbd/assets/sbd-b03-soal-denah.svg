<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Rencana letak objek</title><desc id="desc">Denah tampak atas: rumah di kiri atas, pohon kanan atas, dan sungai di bagian bawah.</desc><rect x="1" y="1" width="718" height="478" rx="20" fill="#fffdf8" stroke="#dce5ef" stroke-width="2"/><g font-family="Arial, sans-serif"><circle cx="35" cy="35" r="13" fill="#f5bf44" stroke="#24334b" stroke-width="2"/><text x="65" y="44" font-size="24" text-anchor="start" fill="#24334b">Rencana letak objek</text><rect x="80" y="110" width="560" height="290" rx="4" fill="#ecfdf5" stroke="#24334b" stroke-width="2"/><rect x="130" y="145" width="135" height="105" rx="2" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="195" y="210" font-size="23" text-anchor="middle" fill="#24334b">Rumah</text><circle cx="510" cy="185" r="45" fill="#0d9488" stroke="#24334b" stroke-width="2"/><text x="510" y="194" font-size="18" text-anchor="middle" fill="#fff">Pohon</text><path d="M 175 335 Q 330 265 550 335" fill="none" stroke="#2563eb" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/><text x="345" y="355" font-size="22" text-anchor="middle" fill="#24334b">Sungai</text><line x1="80" y1="435" x2="640" y2="435" stroke="#24334b" stroke-width="3"/><text x="360" y="464" font-size="19" text-anchor="middle" fill="#24334b">Tampak atas: letak objek direncanakan</text></g></svg>
