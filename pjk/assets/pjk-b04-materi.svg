<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="t d"><title id="t">Belajar PJOK dengan aman</title><desc id="d">Tubuh memerlukan makanan beragam dan air untuk bertumbuh serta bergerak. Kamu akan mengenali kelompok pangan, membaca label, dan merancang pilihan yang sesuai keadaan keluarga. Kebutuhan tiap orang dapat berbeda; kegiatan ini tidak menetapkan diet medis atau target berat badan.</desc><rect x="1" y="1" width="718" height="438" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Belajar PJOK dengan aman</text><circle cx="350" cy="280" r="125" fill="#fff" stroke="#24334b" stroke-width="2"/><path d="M 350 155 A125 125 0 0 0 350 405 L350 280 Z" fill="#bbf7d0" stroke="#24334b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 155 A125 125 0 0 1 350 405 L350 280 Z" fill="#ffedd5" stroke="#24334b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="350" y1="155" x2="350" y2="405" stroke="#24334b" stroke-width="3"/><text x="286" y="250" font-size="20" text-anchor="middle" fill="#24334b">Sayur</text><text x="286" y="300" font-size="20" text-anchor="middle" fill="#24334b">dan buah</text><text x="414" y="250" font-size="20" text-anchor="middle" fill="#24334b">Pokok</text><text x="414" y="300" font-size="20" text-anchor="middle" fill="#24334b">dan lauk</text><rect x="535" y="210" width="55" height="120" rx="9" fill="#bfdbfe" stroke="#24334b" stroke-width="2"/><text x="561" y="370" font-size="20" text-anchor="middle" fill="#24334b">Air</text></g></svg>
