<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Cerita tentang keberanian Rara</title><desc id="desc">DAHULU: Takut bertanya. USAHA: Mencoba bertanya kepada guru. SEKARANG: Lebih berani meminta penjelasan.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Cerita tentang keberanian Rara</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><circle cx="60" cy="59" r="43" fill="#fed7aa"/><circle cx="45" cy="51" r="4" fill="#17324d"/><circle cx="75" cy="51" r="4" fill="#17324d"/><path d="M40 83 Q60 62 81 83" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 28 Q60 0 93 29" fill="none" stroke="#78350f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">DAHULU</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Takut bertanya.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><path d="M32 101 L22 62 Q22 52 31 57 L42 72 L42 21 Q42 10 51 18 L53 52 L56 13 Q58 4 66 15 L67 53 L73 20 Q80 13 84 23 L82 60 L92 36 Q101 31 104 41 L92 94 Q86 112 61 112 L44 111 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">USAHA</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Mencoba bertanya kepada guru.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><circle cx="60" cy="59" r="43" fill="#fed7aa"/><circle cx="45" cy="51" r="4" fill="#17324d"/><circle cx="75" cy="51" r="4" fill="#17324d"/><path d="M40 70 Q60 89 81 70" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 28 Q60 0 93 29" fill="none" stroke="#78350f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">SEKARANG</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Lebih berani meminta penjelasan.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>