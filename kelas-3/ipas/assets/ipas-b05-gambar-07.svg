<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Barang milik Sari</title><desc id="desc">A: Pensil habis; perlu untuk tugas besok. B: Tas masih kuat; ingin gambar baru. C: Kotak makan layak; ingin warna lain.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Barang milik Sari</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><g transform="translate(35 35) scale(.42)"><polygon points="20,95 76,15 93,27 37,107" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><polygon points="20,95 14,115 37,107" fill="#ffedd5" stroke="#92400e" stroke-width="3"/><path d="M69 25 L84 36" fill="none" stroke="#fb7185" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">A</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Pensil habis; perlu untuk tugas</text><text x="184" y="189" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">besok.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><rect x="18" y="34" width="87" height="77" rx="17" fill="#818cf8" stroke="#4338ca" stroke-width="3"/><path d="M42 35 L42 20 Q61 2 80 20 L80 35" fill="none" stroke="#4338ca" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="33" y="67" width="57" height="32" rx="8" fill="#c7d2fe"