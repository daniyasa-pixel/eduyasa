<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Uji jumlah air pada cat</title><desc id="desc">P percobaan cat banyak air dengan warna menyebar, Q sedikit air dengan garis yang lebih terarah.</desc><rect x="1" y="1" width="718" height="478" rx="20" fill="#fffdf8" stroke="#dce5ef" stroke-width="2"/><g font-family="Arial, sans-serif"><circle cx="35" cy="35" r="13" fill="#f5bf44" stroke="#24334b" stroke-width="2"/><text x="65" y="44" font-size="24" text-anchor="start" fill="#24334b">Uji jumlah air pada cat</text><rect x="65" y="125" width="260" height="225" rx="10" fill="#fffdf8" stroke="#24334b" stroke-width="2"/><text x="195" y="390" font-size="25" text-anchor="middle" fill="#24334b">P</text><path d="M 95 275 Q 185 160 290 245" fill="none" stroke="#2563eb" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="135" cy="250" rx="28" ry="43" fill="#93c5fd" transform="rotate(20 135 250)"/><ellipse cx="175" cy="250" rx="28" ry="43" fill="#93c5fd" transform="rotate(20 175 250)"/><ellipse cx="210" cy="250" rx="28" ry="43" fill="#93c5fd" transform="rotate(20 210 250)"/><text x="195" y="155" font-size="19" text-anchor="middle" fill="#24334b">Banyak air</text><rect x="405" y="125" width="260" height="225" rx="10" fill="#fffdf8" stroke="#24334b" stroke-width="2"/><text x="535" y="390" font-size="25" text-anchor="middle" fill="#24334b">Q</text><path d="M 435 275 Q 525 160 630 245" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="155" font-size="19" text-anchor="middle" fill="#24334b">Sedikit air</text></g></svg>
