<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Rancangan capung tiga dimensi</title><desc id="desc">Badan capung memanjang dengan empat sayap, dua di kiri dan dua di kanan.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="320" y="55" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">RANCANGAN CAPUNG</text><ellipse cx="320" cy="175" rx="55" ry="42" fill="#fbbf24" stroke="#a16207" stroke-width="3"/><path d="M320 210 Q325 255 315 300" stroke="#92400e" stroke-width="26" stroke-linecap="round"/><circle cx="300" cy="165" r="6" fill="#0f172a"/><circle cx="340" cy="165" r="6" fill="#0f172a"/><ellipse cx="225" cy="120" rx="80" ry="30" transform="rotate(20 225 120)" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/><ellipse cx="225" cy="220" rx="80" ry="30" transform="rotate(-20 225 220)" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/><ellipse cx="415" cy="120" rx="80" ry="30" transform="rotate(-20 415 120)" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/><ellipse cx="415" cy="220" rx="80" ry="30" transform="rotate(20 415 220)" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/><text x="105" y="115" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">2 sayap kiri</text><text x="535" y="115" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">2 sayap kanan</text></svg>