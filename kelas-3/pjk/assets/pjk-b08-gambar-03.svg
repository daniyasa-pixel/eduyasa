<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Pilihan waktu luang</title><desc id="desc">Empat kartu menunjukkan bermain di halaman, membaca, berlari di jalan raya, dan merusak tanaman.</desc><rect width="640" height="360" rx="24" fill="#f6fbff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#287da8" stroke-width="3"/><rect x="60" y="75" width="250" height="95" rx="14" fill="#dcfce7" stroke="#287da8" stroke-width="2"/><text x="185" y="130" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Halaman aman</text><rect x="330" y="75" width="250" height="95" rx="14" fill="#dbeafe" stroke="#287da8" stroke-width="2"/><text x="455" y="130" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Membaca</text><rect x="60" y="205" width="250" height="95" rx="14" fill="#fee2e2" stroke="#287da8" stroke-width="2"/><text x="185" y="260" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Jalan raya</text><rect x="330" y="205" width="250" height="95" rx="14" fill="#fee2e2" stroke="#287da8" stroke-width="2"/><text x="455" y="260" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Rusak tanaman</text></svg>