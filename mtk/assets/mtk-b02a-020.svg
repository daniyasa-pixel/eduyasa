<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Skala denah ruang</title><desc id="desc">Denah ruang kelas dengan panjang 4 cm dan lebar 3 cm, berskala 1 banding 200.</desc><rect width="640" height="400" rx="16" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="24" text-anchor="middle" fill="#172033">Skala denah ruang</text><rect x="140" y="100" width="320" height="190" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="300" y="85" font-size="22" text-anchor="middle" fill="#172033">4 cm</text><text x="85" y="205" font-size="22" text-anchor="middle" fill="#172033">3 cm</text><text x="320" y="345" font-size="22" text-anchor="middle" fill="#172033">Skala 1 : 200</text></g></svg>
