<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 710" role="img" aria-labelledby="title desc"><title id="title">Senar dan bunyi</title><desc id="desc">Pengamatan satu senar model oleh guru: P senar diam tanpa petikan, tidak terdengar bunyi; Q senar dipetik pelan, tampak bergetar dan terdengar bunyi; R senar disentuh lembut hingga berhenti bergetar, bunyi berhenti.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="710" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Senar dan bunyi</text><rect x="24" y="80" width="672" height="169" rx="18" fill="white" stroke="none" stroke-width="3"/><text x="48" y="115" font-size="28" fill="#17324d" text-anchor="start" font-weight="750">P</text><rect x="102" y="110" width="110" height="105" rx="10" fill="#fed7aa" stroke="none" stroke-width="3"/><path d="M110 165 L204 165" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="135" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">Senar diam; tidak terdengar</text><text x="260" y="166" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">bunyi.</text><rect x="24" y="265" width="672" height="169" rx="18" fill="white" stroke="none" stroke-width="3"/><text x="48" y="300" font-size="28" fill="#17324d" text-anchor="start" font-weight="750">Q</text><rect x="102" y="295" width="110" height="105" rx="10" fill="#fed7aa" stroke="none" stroke-width="3"/><path d="M110 350 L204 350" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 350 Q140 315 157 350 Q181 385 204 350" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="320" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">Dipetik pelan; bergetar dan</text><text x="260" y="351" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">berbunyi.</text><rect x="24" y="450" width="672" height="169" rx="18" fill="white" stroke="none" stroke-width="3"/><text x="48" y="485" font-size="28" fill="#17324d" text-anchor="start" font-weight="750">R</text><rect x="102" y="480" width="110" height="105" rx="10" fill="#fed7aa" stroke="none" stroke-width="3"/><path d="M110 535 L204 535" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="505" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">Getaran dihentikan lembut;</text><text x="260" y="536" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">bunyi berhenti.</text><text x="360" y="674" font-size="22" fill="#17324d" text-anchor="middle" font-weight="500">Model yang sama; ditangani guru.</text></g></svg>