<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Fungsi bahan pangan</title><desc id="desc">Tiga baris memasangkan nasi dengan energi, tempe dengan pertumbuhan, sayur dengan vitamin mineral serat.</desc><rect width="640" height="360" rx="24" fill="#f6fbff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#287da8" stroke-width="3"/><text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700">Bahan dan fungsi</text><rect x="70" y="85" width="180" height="55" rx="10" fill="#fef3c7"/><rect x="360" y="85" width="210" height="55" rx="10" fill="#dcfce7"/><path d="M250 112h110" stroke="#287da8" stroke-width="4"/><text x="160" y="120" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Nasi</text><text x="465" y="120" text-anchor="middle" font-family="sans-serif" font-size="17">energi</text><rect x="70" y="160" width="180" height="55" rx="10" fill="#fef3c7"/><rect x="360" y="160" width="210" height="55" rx="10" fill="#dcfce7"/><path d="M250 187h110" stroke="#287da8" stroke-width="4"/><text x="160" y="195" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Tempe</text><text x="465" y="195" text-anchor="middle" font-family="sans-serif" font-size="17">pertumbuhan</text><rect x="70" y="235" width="180" height="55" rx="10" fill="#fef3c7"/><rect x="360" y="235" width="210" height="55" rx="10" fill="#dcfce7"/><path d="M250 262h110" stroke="#287da8" stroke-width="4"/><text x="160" y="270" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Sayur</text><text x="465" y="270" text-anchor="middle" font-family="sans-serif" font-size="17">vitamin • mineral • serat</text></svg>