<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Sisi yang berhadapan</title><desc id="desc">Jaring-jaring: B, C, D, E sebaris dari kiri; A di atas C dan F di bawah C.</desc><rect width="640" height="400" rx="16" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="24" text-anchor="middle" fill="#172033">Sisi yang berhadapan</text><rect x="225" y="90" width="75" height="75" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="262" y="137" font-size="23" text-anchor="middle" fill="#172033">A</text><rect x="150" y="165" width="75" height="75" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="187" y="212" font-size="23" text-anchor="middle" fill="#172033">B</text><rect x="225" y="165" width="75" height="75" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="262" y="212" font-size="23" text-anchor="middle" fill="#172033">C</text><rect x="300" y="165" width="75" height="75" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="337" y="212" font-size="23" text-anchor="middle" fill="#172033">D</text><rect x="375" y="165" width="75" height="75" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="412" y="212" font-size="23" text-anchor="middle" fill="#172033">E</text><rect x="225" y="240" width="75" height="75" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="262" y="287" font-size="23" text-anchor="middle" fill="#172033">F</text></g></svg>
