<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Jadwal kegiatan</title><desc id="desc">Pagi: Sarapan lalu berangkat sekolah. Siang: Bermain aktif lalu minum air. Malam: Bersiap tidur.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Jadwal kegiatan</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><polygon points="8,54 60,11 112,54" fill="#fb7185" stroke="#9f1239" stroke-width="3"/><rect x="21" y="54" width="78" height="59" rx="3" fill="#fef3c7" stroke="none" stroke-width="3"/><rect x="50" y="75" width="24" height="38" rx="2" fill="#b45309" stroke="none" stroke-width="3"/><rect x="28" y="66" width="15" height="18" rx="2" fill="#7dd3fc" stroke="none" stroke-width="3"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Pagi</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Sarapan lalu berangkat sekolah.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><path d="M61 8 Q12 61 25 89 Q42 121 76 106 Q117 87 61 8 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 79 Q36 94 51 97" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Siang</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Bermain aktif lalu minum air.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><circle cx="60" cy="59" r="43" fill="#fed7aa"/><circle cx="45" cy="51" r="4" fill="#17324d"/><circle cx="75" cy="51" r="4" fill="#17324d"/><path d="M40 70 Q60 89 81 70" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 28 Q60 0 93 29" fill="none" stroke="#78350f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Malam</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Bersiap tidur.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>