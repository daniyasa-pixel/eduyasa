="26" fill="#17324d" text-anchor="start" font-weight="600">Kulit kuning; permukaan halus.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><path d="M8 60 Q58 5 112 60 Q60 113 8 60 Z" fill="white" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="60" r="24" fill="#38bdf8"/><circle cx="60" cy="60" r="12" fill="#17324d"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Catatan</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Rasa kedua buah belum diuji.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>