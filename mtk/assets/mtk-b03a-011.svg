<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Mengisi balok dengan kubus satuan</title><desc id="desc">Balok berukuran 4 cm kali 3 cm kali 2 cm, diisi kubus satuan berusuk 1 cm.</desc><rect width="640" height="400" rx="16" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="24" text-anchor="middle" fill="#172033">Mengisi balok dengan kubus satuan</text><polygon points="170,180 400,180 400,310 170,310" fill="#dbeafe" stroke="#172033" stroke-width="2"/><polygon points="170,180 400,180 480,110 250,110" fill="#bfdbfe" stroke="#172033" stroke-width="2"/><polygon points="400,180 400,310 480,240 480,110" fill="#93c5fd" stroke="#172033" stroke-width="2"/><text x="285" y="345" font-size="22" text-anchor="middle" fill="#172033">4 cm</text><text x="460" y="300" font-size="22" text-anchor="middle" fill="#172033">3 cm</text><text x="115" y="250" font-size="22" text-anchor="middle" fill="#172033">2 cm</text><text x="320" y="70" font-size="22" text-anchor="middle" fill="#172033">Kubus satuan: rusuk 1 cm</text><text x="320" y="382" font-size="18" text-anchor="middle" fill="#172033">Sketsa tidak harus berskala</text></g></svg>
