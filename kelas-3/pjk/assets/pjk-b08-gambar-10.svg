<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Kartu alergi kacang</title><desc id="desc">Kartu siswa bertuliskan alergi kacang dengan empat pilihan: roti kacang, pisang, permen kacang, kue kacang.</desc><rect width="640" height="360" rx="24" fill="#f6fbff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#287da8" stroke-width="3"/><rect x="60" y="75" width="220" height="85" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="170" y="110" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">ALERGI KACANG</text><text x="170" y="138" text-anchor="middle" font-family="sans-serif" font-size="16">periksa bahan</text><rect x="65" y="205" width="245" height="50" rx="10" fill="#fef3c7"/><text x="187" y="237" text-anchor="middle" font-family="sans-serif" font-size="17">Roti kacang</text><rect x="330" y="205" width="245" height="50" rx="10" fill="#dcfce7"/><text x="452" y="237" text-anchor="middle" font-family="sans-serif" font-size="17">Pisang</text><rect x="65" y="275" width="245" height="50" rx="10" fill="#fef3c7"/><text x="187" y="307" text-anchor="middle" font-family="sans-serif" font-size="17">Permen kacang</text><rect x="330" y="275" width="245" height="50" rx="10" fill="#fef3c7"/><text x="452" y="307" text-anchor="middle" font-family="sans-serif" font-size="17">Kue kacang</text></svg>