<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Membaca simbol pada jalur</title><desc id="desc">Legenda denah rekaan: segitiga hijau melambangkan bukit, persegi biru melambangkan sekolah, lingkaran jingga melambangkan pasar. Pada jalur dari Mulai terdapat persegi biru lalu lingkaran jingga. Tidak berskala.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Membaca simbol pada jalur</text><path d="M110 430 H610" fill="none" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="485" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Mulai</text><rect x="260" y="397" width="65" height="65" rx="0" fill="#60a5fa" stroke="none" stroke-width="3"/><circle cx="565" cy="430" r="35" fill="#fb923c"/><path d="M70 150 L100 100 L130 150 Z" fill="#65a30d" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="134" font-size="26" fill="#17324d" text-anchor="start" font-weight="500">Bukit</text><rect x="72" y="184" width="56" height="56" rx="0" fill="#60a5fa" stroke="none" stroke-width="3"/><text x="165" y="219" font-size="26" fill="#17324d" text-anchor="start" font-weight="500">Sekolah</text><circle cx="100" cy="295" r="29" fill="#fb923c"/><text x="165" y="304" font-size="26" fill="#17324d" text-anchor="start" font-weight="500">Pasar</text><text x="38" y="560" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">Legenda untuk denah ini saja. Ikuti jalur dari</text><text x="38" y="591" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">kiri ke kanan.</text></g></svg>