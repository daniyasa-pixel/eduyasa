<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Kartu cerita Lani</title><desc id="desc">KARTU A: Lani rutin berlatih menggambar. KARTU B: Gambar Lani menjadi lebih jelas. KARTU C: Lani ingin belajar menggambar.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Kartu cerita Lani</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><polygon points="20,95 76,15 93,27 37,107" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><polygon points="20,95 14,115 37,107" fill="#ffedd5" stroke="#92400e" stroke-width="3"/><path d="M69 25 L84 36" fill="none" stroke="#fb7185" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="96" cy="89" r="17" fill="#a78bfa"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">KARTU A</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Lani rutin berlatih menggambar.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><path d="M15 104 Q7 15 103 14 Q111 98 15 104 Z" fill="#4ade80" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 101 L88 30 M48 71 L38 43 M48 71 L78 76" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">KARTU B</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Gambar Lani menjadi lebih jelas.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><rect x="6" y="12" width="106" height="66" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><polygon points="34,76 29,97 60,77" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="32" cy="43" r="5" fill="#2563eb"/><circle cx="59" cy="43" r="5" fill="#2563eb"/><circle cx="86" cy="43" r="5" fill="#2563eb"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">KARTU C</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Lani ingin belajar menggambar.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>