<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Empat tanda baca</title><desc id="desc">TITIK . DAN KOMA ,: Aku membawa buku, pensil, dan tas. TANDA TANYA ?: Di mana bukumu? TANDA SERU !: Ayo, membaca bersama!</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Empat tanda baca</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><rect x="18" y="34" width="87" height="77" rx="17" fill="#818cf8" stroke="#4338ca" stroke-width="3"/><path d="M42 35 L42 20 Q61 2 80 20 L80 35" fill="none" stroke="#4338ca" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="33" y="67" width="57" height="32" rx="8" fill="#c7d2fe" stroke="none" stroke-width="3"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">TITIK . DAN KOMA ,</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Aku membawa buku, pensil, dan</text><text x="184" y="189" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">tas.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><path d="M12 25 Q35 15 58 27 L58 100 Q35 88 12 100 Z" fill="#93c5fd" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 27 Q82 15 108 25 L108 100 Q82 88 58 100 Z" fill="#fde68a" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 40 L46 39 M22 53 L46 52 M72 40 L96 39 M72 53 L96 52" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">TANDA TANYA ?</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Di mana bukumu?</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><rect x="6" y="12" width="106" height="66" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><polygon points="34,76 29,97 60,77" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="32" cy="43" r="5" fill="#2563eb"/><circle cx="59" cy="43" r="5" fill="#2563eb"/><circle cx="86" cy="43" r="5" fill="#2563eb"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">TANDA SERU !</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Ayo, membaca bersama!</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>