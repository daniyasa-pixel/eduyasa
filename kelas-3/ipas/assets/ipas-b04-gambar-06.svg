<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" role="img" aria-labelledby="title desc"><title id="title">Dua tempat tumbuh</title><desc id="desc">Dua tanaman kacang hijau sejenis dan seumur, air serta media sama. A dekat jendela, lebih pendek, hijau dan tegak. B dalam lemari gelap, lebih panjang, pucat dan lemah.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="690" rx="24" fill="#f0fdfa"/><text x="360" y="40" font-size="28" text-anchor="middle" fill="#17324d">Dua tempat tumbuh</text><rect x="40" y="82" width="280" height="450" rx="18" fill="#fff"/><text x="180" y="120" font-size="28" text-anchor="middle" fill="#17324d">A</text><path d="M180 382 L180 262" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="156" cy="340" rx="26" ry="11" fill="#16a34a" stroke="#34594a" stroke-width="2"/><ellipse cx="204" cy="323" rx="26" ry="11" fill="#16a34a" stroke="#34594a" stroke-width="2"/><ellipse cx="156" cy="295.6" rx="26" ry="11" fill="#16a34a" stroke="#34594a" stroke-width="2"/><ellipse cx="204" cy="278.6" rx="26" ry="11" fill="#16a34a" stroke="#34594a" stroke-width="2"/><path d="M123 380 L237 380 L223 440 L137 440 Z" fill="#fda4af" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="469" font-size="23" text-anchor="middle" fill="#17324d">Dekat jendela;</text><text x="180" y="500" font-size="23" text-anchor="middle" fill="#17324d">hijau dan tegak.</text><rect x="400" y="82" width="280" height="450" rx="18" fill="#fff"/><text x="540" y="120" font-size="28" text-anchor="middle" fill="#17324d">B</text><path d="M540 382 L540 162" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="516" cy="305" rx="26" ry="11" fill="#eab308" stroke="#34594a" stroke-width="2"/><ellipse cx="564" cy="288" rx="26" ry="11" fill="#eab308" stroke="#34594a" stroke-width="2"/><ellipse cx="516" cy="223.6" rx="26" ry="11" fill="#eab308" stroke="#34594a" stroke-width="2"/><ellipse cx="564" cy="206.6" rx="26" ry="11" fill="#eab308" stroke="#34594a" stroke-width="2"/><path d="M483 380 L597 380 L583 440 L497 440 Z" fill="#fda4af" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="469" font-size="23" text-anchor="middle" fill="#17324d">Dalam lemari gelap;</text><text x="540" y="500" font-size="23" text-anchor="middle" fill="#17324d">pucat dan lemah.</text><text x="38" y="575" font-size="24" text-anchor="start" fill="#17324d">Kacang hijau sejenis, umur sama, air dan media</text><text x="38" y="606" font-size="24" text-anchor="start" fill="#17324d">sama; diamati setelah beberapa hari.</text></g></svg>