<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Perbandingan alas sempit dan lebar</title><desc id="desc">Model A bertubuh sama dengan alas sempit. Model B bertubuh sama dengan alas lebih lebar.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="175" y="62" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">MODEL A</text><rect x="125" y="105" width="100" height="125" rx="35" fill="#fbbf24" stroke="#b45309" stroke-width="3"/><rect x="155" y="230" width="40" height="55" fill="#92400e"/><rect x="138" y="285" width="74" height="14" rx="7" fill="#64748b"/><path d="M120 312 H230" stroke="#94a3b8" stroke-width="3"/><text x="465" y="62" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">MODEL B</text><rect x="415" y="105" width="100" height="125" rx="35" fill="#fbbf24" stroke="#b45309" stroke-width="3"/><rect x="445" y="230" width="40" height="55" fill="#92400e"/><rect x="380" y="285" width="170" height="14" rx="7" fill="#16a34a"/><path d="M365 312 H565" stroke="#94a3b8" stroke-width="3"/><text x="175" y="335" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">alas sempit</text><text x="465" y="335" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">alas lebar</text></svg>