<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 5.4</title><desc id="d">Danu melihat guru menyiapkan kompres dingin. Pilihan P: Menempel es langsung lama pada kulit. Pilihan Q: Memastikan penanganan dipandu orang dewasa dan dingin tidak ditempel langsung ke kulit.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 5.4</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Danu melihat guru menyiapkan kompres dingin.</text><rect x="210" y="195" width="300" height="170" rx="18" fill="#fff" stroke="#24334b" stroke-width="2"/><rect x="265" y="225" width="190" height="100" rx="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="360" y="400" font-size="22" text-anchor="middle" fill="#24334b">Kompres memakai pelindung kulit</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Menempel es langsung lama</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">pada kulit</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Memastikan penanganan</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">dipandu orang dewasa dan</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">dingin tidak ditempel</text><text x="405" y="617" font-size="22" text-anchor="start" fill="#24334b">langsung ke kulit</text></g></svg>
