<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Kartu huruf</title><desc id="desc">Enam kartu sama besar bertuliskan A, A, A, B, B, dan C.</desc><rect width="640" height="400" rx="16" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="24" text-anchor="middle" fill="#172033">Kartu huruf</text><rect x="45" y="105" width="58" height="80" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="74" y="154" font-size="25" text-anchor="middle" fill="#172033">A</text><rect x="118" y="105" width="58" height="80" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="147" y="154" font-size="25" text-anchor="middle" fill="#172033">A</text><rect x="191" y="105" width="58" height="80" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="220" y="154" font-size="25" text-anchor="middle" fill="#172033">A</text><rect x="264" y="105" width="58" height="80" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="293" y="154" font-size="25" text-anchor="middle" fill="#172033">B</text><rect x="337" y="105" width="58" height="80" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="366" y="154" font-size="25" text-anchor="middle" fill="#172033">B</text><rect x="410" y="105" width="58" height="80" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="439" y="154" font-size="25" text-anchor="middle" fill="#172033">C</text><text x="320" y="355" font-size="20" text-anchor="middle" fill="#172033">Kartu berukuran sama dan diacak</text></g></svg>
