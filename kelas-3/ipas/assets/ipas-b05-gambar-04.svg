<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">Dua tawaran barter</title><desc id="desc">Dua tawaran barter: A Rina membawa pisang dan membutuhkan beras; Bimo membawa beras dan membutuhkan pisang. B Dika membawa mangga dan membutuhkan ikan; Sita membawa ikan tetapi membutuhkan beras.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="700" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Dua tawaran barter</text><rect x="24" y="80" width="672" height="232" rx="18" fill="#dcfce7" stroke="none" stroke-width="3"/><text x="50" y="117" font-size="29" fill="#17324d" text-anchor="start" font-weight="750">A</text><text x="80" y="155" font-size="26" fill="#17324d" text-anchor="start" font-weight="500">Rina: membawa pisang, perlu beras. Bimo:</text><text x="80" y="186" font-size="26" fill="#17324d" text-anchor="start" font-weight="500">membawa beras, perlu pisang.</text><path d="M130 278 L580 278 M148 266 L130 278 L148 290 M562 266 L580 278 L562 290" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="340" width="672" height="250" rx="18" fill="#fef3c7" stroke="none" stroke-width="3"/><text x="50" y="378" font-size="29" fill="#17324d" text-anchor="start" font-weight="750">B</text><text x="80" y="420" font-size="26" fill="#17324d" text-anchor="start" font-weight="500">Dika: membawa mangga, perlu ikan. Sita:</text><text x="80" y="451" font-size="26" fill="#17324d" text-anchor="start" font-weight="500">membawa ikan, perlu beras.</text><text x="38" y="635" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Kesepakatan nilai tetap perlu dibicarakan.</text></g></svg>