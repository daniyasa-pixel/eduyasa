<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 5.1</title><desc id="d">Alya melihat teman jatuh dekat lantai basah. Pilihan P: Menjaga diri di tempat aman dan memanggil guru. Pilihan Q: Berlari melintasi lantai licin tanpa melihat.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 5.1</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Alya melihat teman jatuh dekat lantai basah.</text><ellipse cx="310" cy="320" rx="160" ry="55" fill="#bfdbfe" transform="rotate(0 310 320)"/><polygon points="520,185 610,355 430,355" fill="#f5bf44" stroke="#24334b" stroke-width="2"/><text x="520" y="315" font-size="65" text-anchor="middle" fill="#24334b">!</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Menjaga diri di tempat</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">aman dan memanggil guru</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Berlari melintasi lantai</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">licin tanpa melihat</text></g></svg>
