<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Perbandingan karya dua dimensi dan tiga dimensi</title><desc id="desc">Karya A berupa gambar ikan pada kertas datar. Karya B berupa ikan bervolume pada alas yang dapat diamati dari beberapa arah.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="165" y="60" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">A — gambar datar</text><rect x="70" y="80" width="190" height="210" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><ellipse cx="160" cy="180" rx="55" ry="30" fill="#38bdf8"/><polygon points="210,180 245,150 245,210" fill="#0ea5e9"/><circle cx="135" cy="172" r="5" fill="#0f172a"/><text x="475" y="60" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">B — bentuk bervolume</text><ellipse cx="455" cy="175" rx="72" ry="45" fill="#fb923c" stroke="#c2410c" stroke-width="3"/><ellipse cx="470" cy="185" rx="55" ry="30" fill="#fdba74" opacity=".7"/><polygon points="520,175 570,130 570,220" fill="#f97316" stroke="#c2410c" stroke-width="3"/><circle cx="420" cy="160" r="6" fill="#0f172a"/><ellipse cx="470" cy="270" rx="115" ry="20" fill="#cbd5e1"/></svg>