<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Model gas menempati ruang</title><desc id="desc">Model gas yang sama dalam wadah tertutup: A ruang kecil dengan enam titik model, B ruang lebih besar dengan enam titik lebih tersebar. Titik biru adalah model, bukan warna atau ukuran nyata udara. Tidak ada zat keluar atau masuk.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Model gas menempati ruang</text><rect x="80" y="220" width="200" height="200" rx="10" fill="white" stroke="#475569" stroke-width="3"/><text x="180.0" y="195" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">A</text><circle cx="115" cy="255" r="9" fill="#0284c7"/><circle cx="220" cy="255" r="9" fill="#0284c7"/><circle cx="155" cy="315" r="9" fill="#0284c7"/><circle cx="240" cy="340" r="9" fill="#0284c7"/><circle cx="115" cy="380" r="9" fill="#0284c7"/><circle cx="200" cy="380" r="9" fill="#0284c7"/><rect x="370" y="130" width="270" height="350" rx="10" fill="white" stroke="#475569" stroke-width="3"/><text x="505.0" y="105" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">B</text><circle cx="410" cy="170" r="9" fill="#0284c7"/><circle cx="580" cy="180" r="9" fill="#0284c7"/><circle cx="465" cy="270" r="9" fill="#0284c7"/><circle cx="590" cy="340" r="9" fill="#0284c7"/><circle cx="415" cy="405" r="9" fill="#0284c7"/><circle cx="540" cy="440" r="9" fill="#0284c7"/><text x="38" y="555" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Model gas sama; ruang diperbesar tanpa keluar-</text><text x="38" y="586" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">masuk zat. Titik hanya model, bukan warna</text><text x="38" y="617" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">udara.</text></g></svg>