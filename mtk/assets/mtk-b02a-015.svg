<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Memperbesar gambar</title><desc id="desc">Gambar awal persegi panjang berukuran 6 cm kali 4 cm; panjang hasil perbesaran 15 cm.</desc><rect width="640" height="400" rx="16" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="24" text-anchor="middle" fill="#172033">Memperbesar gambar</text><rect x="110" y="105" width="210" height="140" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="215" y="90" font-size="22" text-anchor="middle" fill="#172033">6 cm</text><text x="65" y="185" font-size="22" text-anchor="middle" fill="#172033">4 cm</text><text x="450" y="170" font-size="22" text-anchor="middle" fill="#172033">Diperbesar</text><text x="450" y="210" font-size="20" text-anchor="middle" fill="#172033">panjang 15 cm</text></g></svg>
