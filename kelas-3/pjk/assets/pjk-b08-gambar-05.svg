<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Piring beragam</title><desc id="desc">Piring dibagi menjadi makanan pokok, lauk, sayur, buah, serta gelas air.</desc><rect width="640" height="360" rx="24" fill="#f6fbff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#287da8" stroke-width="3"/><circle cx="265" cy="190" r="120" fill="#fff" stroke="#287da8" stroke-width="6"/><path d="M265 70v240M145 190h240" stroke="#287da8" stroke-width="3"/><text x="205" y="145" text-anchor="middle" font-family="sans-serif" font-size="18">pokok</text><text x="325" y="145" text-anchor="middle" font-family="sans-serif" font-size="18">lauk</text><text x="205" y="245" text-anchor="middle" font-family="sans-serif" font-size="18">sayur</text><text x="325" y="245" text-anchor="middle" font-family="sans-serif" font-size="18">buah</text><rect x="445" y="125" width="85" height="125" rx="10" fill="#dbeafe" stroke="#287da8" stroke-width="4"/><text x="487" y="285" text-anchor="middle" font-family="sans-serif" font-size="18">air</text></svg>