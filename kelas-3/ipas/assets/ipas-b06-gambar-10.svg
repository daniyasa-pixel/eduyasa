<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 710" role="img" aria-labelledby="title desc"><title id="title">Waktu pemakaian lampu</title><desc id="desc">Dua lampu identik dengan daya tetap sama. A digunakan satu jam, B digunakan tiga jam. Grafik waktu dimulai dari nol; tidak ada informasi harga listrik.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="710" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Waktu pemakaian lampu</text><path d="M120 470 H650" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="103" y="478" font-size="23" fill="#17324d" text-anchor="end" font-weight="500">0</text><path d="M120 370 H650" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="103" y="378" font-size="23" fill="#17324d" text-anchor="end" font-weight="500">1</text><path d="M120 270 H650" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="103" y="278" font-size="23" fill="#17324d" text-anchor="end" font-weight="500">2</text><path d="M120 170 H650" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="103" y="178" font-size="23" fill="#17324d" text-anchor="end" font-weight="500">3</text><text x="88" y="124" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">jam</text><rect x="235" y="370" width="100" height="100" rx="2" fill="#60a5fa" stroke="none" stroke-width="3"/><text x="285" y="505" font-size="28" fill="#17324d" text-anchor="middle" font-weight="500">A</text><text x="285" y="358" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">1 jam</text><rect x="470" y="170" width="100" height="300" rx="2" fill="#34d399" stroke="none" stroke-width="3"/><text x="520" y="505" font-size="28" fill="#17324d" text-anchor="middle" font-weight="500">B</text><text x="520" y="158" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">3 jam</text><text x="38" y="567" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">Lampu identik; daya tetap sama. Grafik</text><text x="38" y="598" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">menunjukkan lama menyala. Harga listrik tidak</text><text x="38" y="629" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">dicantumkan.</text></g></svg>