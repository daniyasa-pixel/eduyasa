<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 554" role="img" aria-labelledby="title desc"><title id="title">Daur jangkrik pembanding</title><desc id="desc">Daur jangkrik terdiri atas A telur, B nimfa kecil dengan sayap belum sempurna, C dewasa dengan sayap berkembang; tidak ada tahap pupa.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="554" rx="24" fill="#f0fdfa"/><text x="360" y="40" font-size="28" text-anchor="middle" fill="#17324d">Daur jangkrik pembanding</text><rect x="24" y="64" width="672" height="132" rx="18" fill="#dcfce7"/><text x="45" y="101" font-size="25" text-anchor="start" fill="#17324d">A</text><g transform="translate(135 70) scale(.95)"><circle cx="30" cy="50" r="12" fill="#d1fae5"/><circle cx="30" cy="50" r="5" fill="#334155"/><circle cx="58" cy="42" r="12" fill="#d1fae5"/><circle cx="58" cy="42" r="5" fill="#334155"/><circle cx="86" cy="53" r="12" fill="#d1fae5"/><circle cx="86" cy="53" r="5" fill="#334155"/><circle cx="47" cy="76" r="12" fill="#d1fae5"/><circle cx="47" cy="76" r="5" fill="#334155"/><circle cx="77" cy="79" r="12" fill="#d1fae5"/><circle cx="77" cy="79" r="5" fill="#334155"/></g><text x="270" y="108" font-size="25" text-anchor="start" fill="#17324d">Telur.</text><path d="M675 199 L675 212 M668 206 L675 213 L682 206" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="214" width="672" height="132" rx="18" fill="#dbeafe"/><text x="45" y="251" font-size="25" text-anchor="start" fill="#17324d">B</text><g transform="translate(147 235) scale(.72)"><path d="M39 65 L16 37 L7 40 M56 64 L36 27 L60 18 M78 61 L86 30 M35 73 L13 93 L7 91 M57 73 L36 107 L73 107 M79 68 L94 100" fill="none" stroke="#365314" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="59" cy="64" rx="33" ry="15" fill="#84cc16" stroke="#34594a" stroke-width="2"/><circle cx="93" cy="52" r="14" fill="#a3e635"/><circle cx="98" cy="48" r="3" fill="#17324d"/><path d="M91 39 Q80 6 53 4 M99 40 Q113 12 117 5" fill="none" stroke="#365314" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="258" font-size="25" text-anchor="start" fill="#17324d">Nimfa; kecil, sayap belum</text><text x="270" y="289" font-size="25" text-anchor="start" fill="#17324d">sempurna.</text><path d="M675 349 L675 362 M668 356 L675 363 L682 356" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="364" width="672" height="132" rx="18" fill="#fef3c7"/><text x="45" y="401" font-size="25" text-anchor="start" fill="#17324d">C</text><g transform="translate(135 370) scale(.95)"><path d="M39 65 L16 37 L7 40 M56 64 L36 27 L60 18 M78 61 L86 30 M35 73 L13 93 L7 91 M57 73 L36 107 L73 107 M79 68 L94 100" fill="none" stroke="#365314" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="59" cy="64" rx="33" ry="15" fill="#84cc16" stroke="#34594a" stroke-width="2"/><circle cx="93" cy="52" r="14" fill="#a3e635"/><circle cx="98" cy="48" r="3" fill="#17324d"/><path d="M91 39 Q80 6 53 4 M99 40 Q113 12 117 5" fill="none" stroke="#365314" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 57 L87 54 L53 71 Z" fill="#dcfce7" stroke="#365314" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="408" font-size="25" text-anchor="start" fill="#17324d">Dewasa; sayap sudah</text><text x="270" y="439" font-size="25" text-anchor="start" fill="#17324d">berkembang.</text><text x="360" y="542" font-size="21" text-anchor="middle" fill="#17324d">Baca urutan dari atas ke bawah.</text></g></svg>