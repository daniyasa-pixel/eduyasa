<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Uji sambungan plastisin</title><desc id="desc">Cara A menampilkan dua bagian plastisin terpisah. Cara B menampilkan dua bagian bertemu dengan sambungan diratakan.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="165" y="65" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">CARA A</text><circle cx="125" cy="180" r="55" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3"/><circle cx="225" cy="180" r="55" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3"/><path d="M175 105 V255" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 8"/><text x="165" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#991b1b">terpisah</text><text x="475" y="65" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">CARA B</text><circle cx="445" cy="180" r="60" fill="#86efac" stroke="#15803d" stroke-width="3"/><circle cx="505" cy="180" r="60" fill="#86efac" stroke="#15803d" stroke-width="3"/><path d="M475 125 Q460 180 475 235" fill="none" stroke="#166534" stroke-width="5"/><path d="M458 145 Q475 180 458 215" fill="none" stroke="#bbf7d0" stroke-width="8"/><text x="475" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#166534">ditekan dan diratakan</text></svg>