<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">Pola kartu A dan B</title><desc id="d">Kartu A berisi lingkaran merah dan segitiga biru. Kartu B berisi persegi merah dan lingkaran biru.</desc><rect width="720" height="420" rx="24" fill="#eff6ff"/><g font-family="Arial" fill="#17324d" text-anchor="middle"><text x="360" y="42" font-size="28">Bandingkan bentuk dan warna</text><rect x="24" y="68" width="326" height="304" rx="18" fill="white"/><rect x="370" y="68" width="326" height="304" rx="18" fill="white"/><text x="187" y="112" font-size="28">Kartu A</text><text x="533" y="112" font-size="28">Kartu B</text><circle cx="187" cy="188" r="44" fill="#e11d48"/><polygon points="187,256 139,338 235,338" fill="#2563eb"/><rect x="489" y="144" width="88" height="88" fill="#e11d48"/><circle cx="533" cy="302" r="44" fill="#2563eb"/></g></svg>