<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Utara tidak selalu di atas</title><desc id="desc">Denah dengan utara ke kiri halaman dan timur ke atas. Perpustakaan di tengah, kantin di atasnya, kebun di kiri, gerbang di kanan. Tidak berskala.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Utara tidak selalu di atas</text><rect x="300" y="288" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="390" y="328" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Perpustakaan</text><rect x="300" y="128" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="390" y="168" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Kantin</text><rect x="60" y="288" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="150" y="328" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Kebun</text><rect x="520" y="288" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="610" y="328" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Gerbang</text><circle cx="140" cy="510" r="70" fill="white"/><text x="85" y="517" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">U</text><text x="140" y="462" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">T</text><text x="195" y="517" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">S</text><text x="140" y="572" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">B</text><path d="M140 510 L105.35 510.0" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="505" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">Ikuti petunjuk arah, bukan</text><text x="270" y="536" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">kebiasaan bagian atas</text><text x="270" y="567" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">halaman.</text><text x="360" y="624" font-size="22" fill="#17324d" text-anchor="middle" font-weight="500">Denah tidak berskala.</text></g></svg>