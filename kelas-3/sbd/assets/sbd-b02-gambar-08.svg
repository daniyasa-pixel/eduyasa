<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Saran dan perintah</title><desc id="desc">Kartu kiri memberi saran jarak bentuk; kartu kanan memerintahkan membuang karya.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="45" y="80" width="260" height="200" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><text x="70" y="125" font-family="sans-serif" font-size="20" font-weight="700" fill="#166534"><tspan x="70">Coba beri jarak</tspan><tspan x="70" dy="33">antar bentuk agar</tspan><tspan x="70" dy="33">lebih mudah</tspan><tspan x="70" dy="33">terlihat.</tspan></text><rect x="350" y="105" width="245" height="150" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/><text x="472" y="165" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#991b1b"><tspan x="472">Buang saja</tspan><tspan x="472" dy="38">karyamu!</tspan></text></svg>