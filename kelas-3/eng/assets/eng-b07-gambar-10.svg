<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc"><title id="title">Ruler between book and pencil case</title><desc id="desc">A ruler lies in the middle of a book and a pencil case.</desc><rect width="400" height="240" rx="20" fill="#f5f3ff"/><rect x="30" y="70" width="105" height="110" rx="8" fill="#ef4444" stroke="#991b1b" stroke-width="4"/><text x="82" y="130" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#fff">BOOK</text><rect x="155" y="98" width="90" height="28" rx="4" fill="#fde047" stroke="#a16207" stroke-width="4"/><path d="M170 100v12m15-12v8m15-8v12m15-12v8m15-8v12" stroke="#a16207" stroke-width="2"/><rect x="265" y="82" width="105" height="85" rx="30" fill="#60a5fa" stroke="#1d4ed8" stroke-width="4"/><text x="317" y="130" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">PENCIL CASE</text><text x="200" y="220" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#5b21b6">The ruler is between them.</text></svg>
