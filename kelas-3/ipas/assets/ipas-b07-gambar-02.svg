<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Empat arah antara</title><desc id="desc">Diagram delapan arah: utara di atas, timur di kanan, selatan di bawah, barat di kiri. Titik A kanan atas, titik B kanan bawah, titik C kiri bawah, titik D kiri atas.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Empat arah antara</text><circle cx="360" cy="345" r="148" fill="white"/><path d="M360 345 L360 145" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="145" r="35" fill="#dcfce7"/><text x="360" y="153" font-size="25" fill="#17324d" text-anchor="middle" font-weight="650">Utara</text><path d="M360 345 L590 345" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="590" cy="345" r="35" fill="#dcfce7"/><text x="590" y="353" font-size="25" fill="#17324d" text-anchor="middle" font-weight="650">Timur</text><path d="M360 345 L360 545" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="545" r="35" fill="#dcfce7"/><text x="360" y="553" font-size="25" fill="#17324d" text-anchor="middle" font-weight="650">Selatan</text><path d="M360 345 L130 345" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="130" cy="345" r="35" fill="#dcfce7"/><text x="130" y="353" font-size="25" fill="#17324d" text-anchor="middle" font-weight="650">Barat</text><path d="M360 345 L505 200" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="505" cy="200" r="35" fill="#dcfce7"/><text x="505" y="208" font-size="25" fill="#17324d" text-anchor="middle" font-weight="650">A</text><path d="M360 345 L505 490" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="505" cy="490" r="35" fill="#dcfce7"/><text x="505" y="498" font-size="25" fill="#17324d" text-anchor="middle" font-weight="650">B</text><path d="M360 345 L215 490" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="215" cy="490" r="35" fill="#dcfce7"/><text x="215" y="498" font-size="25" fill="#17324d" text-anchor="middle" font-weight="650">C</text><path d="M360 345 L215 200" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="215" cy="200" r="35" fill="#dcfce7"/><text x="215" y="208" font-size="25" fill="#17324d" text-anchor="middle" font-weight="650">D</text></g></svg>