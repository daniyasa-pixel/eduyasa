<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Mengamati dan menghemat</title><desc id="desc">Amati: Catat gerak, cahaya, panas, dan bunyi. Bandingkan: Ubah satu hal; jaga kondisi lain sama. Gunakan bijak: Matikan yang tidak diperlukan dengan aman.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Mengamati dan menghemat</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><path d="M8 60 Q58 5 112 60 Q60 113 8 60 Z" fill="white" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="60" r="24" fill="#38bdf8"/><circle cx="60" cy="60" r="12" fill="#17324d"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Amati</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Catat gerak, cahaya, panas, dan</text><text x="184" y="189" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">bunyi.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><polygon points="20,95 76,15 93,27 37,107" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><polygon points="20,95 14,115 37,107" fill="#ffedd5" stroke="#92400e" stroke-width="3"/><path d="M69 25 L84 36" fill="none" stroke="#fb7185" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Bandingkan</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Ubah satu hal; jaga kondisi lain</text><text x="184" y="369" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">sama.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><polygon points="8,54 60,11 112,54" fill="#fb7185" stroke="#9f1239" stroke-width="3"/><rect x="21" y="54" width="78" height="59" rx="3" fill="#fef3c7" stroke="none" stroke-width="3"/><rect x="50" y="75" width="24" height="38" rx="2" fill="#b45309" stroke="none" stroke-width="3"/><rect x="28" y="66" width="15" height="18" rx="2" fill="#7dd3fc" stroke="none" stroke-width="3"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Gunakan bijak</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Matikan yang tidak diperlukan</text><text x="184" y="549" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">dengan aman.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>