<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Dua peristiwa berbeda</title><desc id="desc">A: Gula diaduk dalam air; butir tak tampak. B: Es menjadi air di ruang lebih hangat. Catatan: Gula tetap berada dalam larutan.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Dua peristiwa berbeda</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><path d="M13 26 V111 H106 V26" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="17" y="60" width="85" height="47" rx="0" fill="#7dd3fc" stroke="none" stroke-width="3"/><path d="M83 7 L64 87" fill="none" stroke="#92400e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="47" width="17" height="17" rx="1" fill="white" stroke="#94a3b8" stroke-width="3"/><rect x="44" y="36" width="17" height="17" rx="1" fill="white" stroke="#94a3b8" stroke-width="3"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">A</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Gula diaduk dalam air; butir tak</text><text x="184" y="189" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">tampak.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><ellipse cx="66" cy="98" rx="49" ry="16" fill="#7dd3fc"/><rect x="25" y="26" width="58" height="58" rx="5" fill="#dbeafe" stroke="#0284c7" stroke-width="3"/><path d="M34 39 L67 39" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">B</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Es menjadi air di ruang lebih</text><text x="184" y="369" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">hangat.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><polygon points="20,95 76,15 93,27 37,107" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><polygon points="20,95 14,115 37,107" fill="#ffedd5" stroke="#92400e" stroke-width="3"/><path d="M69 25 L84 36" fill="none" stroke="#fb7185" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Catatan</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Gula tetap berada dalam larutan.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>