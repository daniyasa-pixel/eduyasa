<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc"><title id="title">Periksa catatan belanja</title><desc id="desc">Catatan belanja: buku Rp4.000, pensil Rp2.000, total tertulis Rp7.000. Tidak ada biaya lain.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="560" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Periksa catatan belanja</text><rect x="30" y="80" width="270" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="165.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Keterangan</text><rect x="300" y="80" width="390" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="495.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Nilai</text><rect x="30" y="142" width="268" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="165.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Buku</text><rect x="300" y="142" width="388" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="495.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Rp4.000</text><rect x="30" y="242" width="268" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="165.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Pensil</text><rect x="300" y="242" width="388" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="495.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Rp2.000</text><rect x="30" y="342" width="268" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="165.0" y="380" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Total tertulis</text><rect x="300" y="342" width="388" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="495.0" y="380" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Rp7.000</text><text x="38" y="483" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Satu buku dan satu pensil; tidak ada biaya</text><text x="38" y="514" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">lain.</text></g></svg>