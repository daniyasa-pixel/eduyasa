<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Catatan uji kestabilan karya</title><desc id="desc">Karya berbadan tinggi terlihat miring ke kanan di atas alas yang sempit. Panah menunjukkan arah miring.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="320" y="55" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">CATATAN UJI: MIRING KE KANAN</text><g transform="rotate(12 320 210)"><rect x="270" y="95" width="100" height="150" rx="35" fill="#a7f3d0" stroke="#047857" stroke-width="4"/><rect x="305" y="240" width="30" height="55" fill="#92400e"/><rect x="285" y="292" width="70" height="14" rx="7" fill="#64748b"/></g><path d="M405 120 Q470 170 425 235" fill="none" stroke="#dc2626" stroke-width="5"/><path d="M425 235 l-18 -18 m18 18 l5 -25" stroke="#dc2626" stroke-width="5"/><text x="465" y="270" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#991b1b">arah miring</text><path d="M195 320 H445" stroke="#94a3b8" stroke-width="3"/><text x="320" y="342" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">alas sempit</text></svg>