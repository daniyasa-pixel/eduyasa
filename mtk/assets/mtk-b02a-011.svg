<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Memilih minuman lebih manis</title><desc id="desc">Tabel campuran A: dua gelas sirup dan empat air. B: tiga gelas sirup dan sembilan air.</desc><rect width="640" height="400" rx="16" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="24" text-anchor="middle" fill="#172033">Memilih minuman lebih manis</text><rect x="40.0" y="75" width="186.66666666666666" height="55" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="133.33333333333331" y="110" font-size="20" text-anchor="middle" fill="#172033">Minuman</text><rect x="226.66666666666666" y="75" width="186.66666666666666" height="55" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="320.0" y="110" font-size="20" text-anchor="middle" fill="#172033">Sirup</text><rect x="413.3333333333333" y="75" width="186.66666666666666" height="55" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="506.66666666666663" y="110" font-size="20" text-anchor="middle" fill="#172033">Air</text><rect x="40.0" y="130" width="186.66666666666666" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="133.33333333333331" y="165" font-size="20" text-anchor="middle" fill="#172033">A</text><rect x="226.66666666666666" y="130" width="186.66666666666666" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="320.0" y="165" font-size="20" text-anchor="middle" fill="#172033">2 gelas</text><rect x="413.3333333333333" y="130" width="186.66666666666666" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="506.66666666666663" y="165" font-size="20" text-anchor="middle" fill="#172033">4 gelas</text><rect x="40.0" y="185" width="186.66666666666666" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="133.33333333333331" y="220" font-size="20" text-anchor="middle" fill="#172033">B</text><rect x="226.66666666666666" y="185" width="186.66666666666666" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="320.0" y="220" font-size="20" text-anchor="middle" fill="#172033">3 gelas</text><rect x="413.3333333333333" y="185" width="186.66666666666666" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="506.66666666666663" y="220" font-size="20" text-anchor="middle" fill="#172033">9 gelas</text></g></svg>
