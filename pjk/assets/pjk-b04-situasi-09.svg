<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 4.9</title><desc id="d">Intan hendak makan setelah bermain di luar. Pilihan P: Mencuci tangan dengan sabun dan air mengalir sebelum makan. Pilihan Q: Langsung memegang makanan dengan tangan kotor.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 4.9</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Intan hendak makan setelah bermain di luar.</text><path d="M 370 180 L 480 180 L 480 230 L 450 230" fill="none" stroke="#2563eb" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="440" cy="275" rx="9" ry="18" fill="#60a5fa" transform="rotate(0 440 275)"/><ellipse cx="415" cy="290" rx="9" ry="18" fill="#60a5fa" transform="rotate(0 415 290)"/><ellipse cx="390" cy="305" rx="9" ry="18" fill="#60a5fa" transform="rotate(0 390 305)"/><rect x="200" y="300" width="230" height="55" rx="20" fill="#e5c29f" stroke="#24334b" stroke-width="2"/><text x="360" y="395" font-size="23" text-anchor="middle" fill="#24334b">Sabun dan air mengalir</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Mencuci tangan dengan</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">sabun dan air mengalir</text><text x="55" y="588" font-size="22" text-anchor="start" fill="#24334b">sebelum makan</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="48