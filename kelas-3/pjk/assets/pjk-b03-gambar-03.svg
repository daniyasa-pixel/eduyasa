<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Hasil lempar tangkap</title><desc id="desc">Kartu mencatat delapan lemparan dan enam tangkapan berhasil</desc><rect width="720" height="400" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:20px;font-weight:700}.s{font-size:16px}.line{stroke:#2563eb;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#7c3aed;stroke-width:5;fill:none;stroke-dasharray:12 10}.ball{fill:#f59e0b;stroke:#92400e;stroke-width:3}.person{fill:#bfdbfe;stroke:#1d4ed8;stroke-width:4}.safe{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.warn{fill:#fee2e2;stroke:#dc2626;stroke-width:3}</style><text class="h" x="30" y="45">Catatan latihan</text><rect x="110" y="90" width="500" height="220" rx="20" fill="#fff" stroke="#64748b" stroke-width="4"/><line x1="110" y1="165" x2="610" y2="165" stroke="#64748b" stroke-width="3"/><line x1="400" y1="90" x2="400" y2="310" stroke="#64748b" stroke-width="3"/><text class="l" x="155" y="140">Kesempatan</text><text class="l" x="465" y="140">Hasil</text><text class="s" x="155" y="215">Melempar</text><text class="h" x="500" y="220">8</text><text class="s" x="155" y="275">Tertangkap</text><text class="h" x="500" y="280">6</text></svg>