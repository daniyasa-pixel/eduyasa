<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Alat yang sedang bekerja</title><desc id="desc">Tiga alat: A lampu menyala; B pengeras suara dengan tanda gelombang bunyi; C kipas dengan tanda berputar dan gelombang bunyi.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Alat yang sedang bekerja</text><rect x="24" y="95" width="208" height="390" rx="18" fill="white" stroke="none" stroke-width="3"/><text x="128" y="136" font-size="29" fill="#17324d" text-anchor="middle" font-weight="750">A</text><g transform="translate(63 193)"><circle cx="60" cy="43" r="30" fill="#fde047"/><path d="M44 68 L44 90 L77 90 L77 68" fill="#cbd5e1" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 98 L76 98 M51 106 L69 106" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="128" y="390" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Menyala.</text><rect x="256" y="95" width="208" height="390" rx="18" fill="white" stroke="none" stroke-width="3"/><text x="360" y="136" font-size="29" fill="#17324d" text-anchor="middle" font-weight="750">B</text><g transform="translate(295 193)"><rect x="27" y="10" width="68" height="100" rx="10" fill="#64748b" stroke="none" stroke-width="3"/><circle cx="61" cy="76" r="24" fill="#cbd5e1"/><circle cx="61" cy="76" r="12" fill="#334155"/><circle cx="61" cy="31" r="10" fill="#cbd5e1"/><path d="M103 37 Q123 61 103 87" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="360" y="390" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Mengeluarkan</text><text x="360" y="421" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">suara.</text><rect x="488" y="95" width="208" height="390" rx="18" fill="white" stroke="none" stroke-width="3"/><text x="592" y="136" font-size="29" fill="#17324d" text-anchor="middle" font-weight="750">C</text><g transform="translate(527 193)"><circle cx="60" cy="52" r="47" fill="#dbeafe"/><path d="M60 54 Q10 3 33 18 Q68 -3 60 54 M60 54 Q118 19 105 49 Q114 87 60 54 M60 54 Q61 118 33 99 Q4 84 60 54" fill="#38bdf8" stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="54" r="9" fill="#475569"/><rect x="54" y="97" width="12" height="18" rx="3" fill="#475569" stroke="none" stroke-width="3"/><rect x="30" y="111" width="60" height="8" rx="3" fill="#475569" stroke="none" stroke-width="3"/></g><text x="592" y="390" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Berputar dan</text><text x="592" y="421" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">bersuara.</text><text x="38" y="564" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Tanda lengkung menunjukkan bunyi yang</text><text x="38" y="595" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">terdengar. Gambar skematis alat.</text><path d="M659 222 Q682 244 659 267" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>