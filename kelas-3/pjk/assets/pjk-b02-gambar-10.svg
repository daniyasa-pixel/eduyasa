<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Tabel pemeriksaan kondisi tubuh</title><desc id="desc">Tabel menunjukkan nyaman lanjut, nyeri berhenti, dan pusing berhenti.</desc><rect width="640" height="360" rx="28" fill="#f0fdfa"/><rect x="28" y="24" width="584" height="312" rx="20" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="320" y="55" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#134e4a">PERIKSA KONDISI TUBUH</text><rect x="95" y="85" width="450" height="190" rx="12" fill="#fff" stroke="#64748b" stroke-width="3"/><path d="M95 135h450M95 185h450M95 235h450M330 85v190" stroke="#94a3b8" stroke-width="3"/><g font-family="sans-serif" font-size="20" text-anchor="middle"><text x="210" y="118" font-weight="bold">KONDISI</text><text x="435" y="118" font-weight="bold">TINDAKAN</text><text x="210" y="168" fill="#15803d">nyaman</text><text x="435" y="168" fill="#15803d">lanjut terkendali</text><text x="210" y="218" fill="#b91c1c">nyeri</text><text x="435" y="218" fill="#b91c1c">berhenti</text><text x="210" y="268" fill="#b91c1c">pusing</text><text x="435" y="268" fill="#b91c1c">berhenti</text></g></svg>