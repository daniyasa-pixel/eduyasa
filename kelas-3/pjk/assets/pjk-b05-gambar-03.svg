<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Jalur mundur</title><desc id="desc">Jalur A kosong dan B terhalang tas</desc><rect width="720" height="400" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:20px;font-weight:700}.s{font-size:16px}.line{stroke:#2563eb;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#7c3aed;stroke-width:5;fill:none;stroke-dasharray:12 10}.person{fill:#bfdbfe;stroke:#1d4ed8;stroke-width:4}.safe{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.warn{fill:#fee2e2;stroke:#dc2626;stroke-width:3}</style><text class="h" x="30" y="42">Periksa ruang belakang</text><rect class="safe" x="45" y="75" width="290" height="270" rx="20"/><rect class="warn" x="385" y="75" width="290" height="270" rx="20"/><text class="l" x="180" y="110">A</text><text class="l" x="520" y="110">B</text><path class="dash" d="M275 200 L100 200"/><path class="dash" d="M615 200 L440 200"/><circle class="person" cx="275" cy="200" r="35"/><circle class="person" cx="615" cy="200" r="35"/><rect x="445" y="245" width="80" height="55" rx="8" fill="#f59e0b" stroke="#92400e" stroke-width="3"/><text class="s" x="455" y="278">tas</text><text class="s" x="120" y="315">kosong</text><text class="s" x="450" y="325">terhalang</text></svg>