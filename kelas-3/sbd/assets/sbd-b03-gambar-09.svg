<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Susunan bingkai</title><desc id="desc">Bingkai kiri memiliki hiasan besar menutup gambar; bingkai kanan memiliki hiasan kecil di tepi dan gambar tetap terlihat.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="155" y="62" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#334155">KIRI</text><text x="485" y="62" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#334155">KANAN</text><rect x="70" y="80" width="220" height="220" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="18"/><circle cx="180" cy="190" r="55" fill="#fde68a"/><g fill="#f472b6"><circle cx="125" cy="135" r="50"/><circle cx="230" cy="220" r="60"/></g><rect x="365" y="80" width="220" height="220" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="18"/><circle cx="475" cy="185" r="62" fill="#fde68a"/><g fill="#f472b6"><circle cx="382" cy="100" r="18"/><circle cx="565" cy="100" r="18"/><circle cx="382" cy="280" r="18"/><circle cx="565" cy="280" r="18"/></g></svg>