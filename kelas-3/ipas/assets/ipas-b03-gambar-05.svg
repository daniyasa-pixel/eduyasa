<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Kesempatan belajar</title><desc id="desc">Sita: Sedang belajar mengikat tali sepatu. Bima: Sudah terampil mengikat tali sepatu. Dukungan: Keduanya boleh belajar sesuai kebutuhannya.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Kesempatan belajar</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><path d="M32 101 L22 62 Q22 52 31 57 L42 72 L42 21 Q42 10 51 18 L53 52 L56 13 Q58 4 66 15 L67 53 L73 20 Q80 13 84 23 L82 60 L92 36 Q101 31 104 41 L92 94 Q86 112 61 112 L44 111 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Sita</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Sedang belajar mengikat tali</text><text x="184" y="189" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">sepatu.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><circle cx="60" cy="59" r="43" fill="#fed7aa"/><circle cx="45" cy="51" r="4" fill="#17324d"/><circle cx="75" cy="51" r="4" fill="#17324d"/><path d="M40 70 Q60 89 81 70" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 28 Q60 0 93 29" fill="none" stroke="#78350f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Bima</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Sudah terampil mengikat tali</text><text x="184" y="369" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">sepatu.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><rect x="6" y="12" width="106" height="66" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><polygon points="34,76 29,97 60,77" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="32" cy="43" r="5" fill="#2563eb"/><circle cx="59" cy="43" r="5" fill="#2563eb"/><circle cx="86" cy="43" r="5" fill="#2563eb"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Dukungan</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Keduanya boleh belajar sesuai</text><text x="184" y="549" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">kebutuhannya.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>