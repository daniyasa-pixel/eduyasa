hon rimbun membuat teduh.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><path d="M12 25 Q35 15 58 27 L58 100 Q35 88 12 100 Z" fill="#93c5fd" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 27 Q82 15 108 25 L108 100 Q82 88 58 100 Z" fill="#fde68a" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 40 L46 39 M22 53 L46 52 M72 40 L96 39 M72 53 L96 52" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">URUT ABJAD</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">ceria → damai → gigih</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>