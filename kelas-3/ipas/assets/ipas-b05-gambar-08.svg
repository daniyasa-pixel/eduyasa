<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc"><title id="title">Catatan tabungan Naya</title><desc id="desc">Catatan tabungan Naya dari saldo awal nol: Senin masuk Rp1.000, Selasa masuk Rp2.000, Rabu keluar Rp1.000. Tidak ada transaksi lain.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="560" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Catatan tabungan Naya</text><rect x="30" y="80" width="160" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="110.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Hari</text><rect x="190" y="80" width="260" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="320.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Perubahan</text><rect x="450" y="80" width="240" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="570.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Jumlah</text><rect x="30" y="142" width="158" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="110.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Senin</text><rect x="190" y="142" width="258" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="320.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Masuk</text><rect x="450" y="142" width="238" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="570.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Rp1.000</text><rect x="30" y="242" width="158" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="110.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Selasa</text><rect x="190" y="242" width="258" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="320.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Masuk</text><rect x="450" y="242" width="238" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="570.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Rp2.000</text><rect x="30" y="342" width="158" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="110.0" y="380" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Rabu</text><rect x="190" y="342" width="258" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="320.0" y="380" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Keluar</text><rect x="450" y="342" width="238" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="570.0" y="380" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Rp1.000</text><text x="38" y="483" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Saldo awal nol. Tidak ada transaksi lain.</text></g></svg>