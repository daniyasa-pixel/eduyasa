<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Delapan arah mata angin</title><desc id="desc">Utara atas, timur kanan, selatan bawah, barat kiri; timur laut kanan atas, tenggara kanan bawah, barat daya kiri bawah, barat laut kiri atas.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Delapan arah mata angin</text><circle cx="360" cy="340" r="150" fill="white"/><path d="M360 340 L360 130" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="138" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Utara</text><path d="M360 340 L570 340" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="570" y="348" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Timur</text><path d="M360 340 L360 550" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="558" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Selatan</text><path d="M360 340 L150 340" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="348" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Barat</text><path d="M360 340 L505 195" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="505" y="203" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Timur laut</text><path d="M360 340 L505 485" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="505" y="493" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Tenggara</text><path d="M360 340 L215 485" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="215" y="493" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Barat daya</text><path d="M360 340 L215 195" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="215" y="203" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Barat laut</text></g></svg>