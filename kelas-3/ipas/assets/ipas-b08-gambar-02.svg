<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Kubus dipindahkan</title><desc id="desc">Satu kubus kayu dipindahkan dari wadah A yang sempit ke wadah B yang lebar. Kubus tetap berukuran dan berbentuk sama, tidak dipanaskan atau dirusak.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Kubus dipindahkan</text><path d="M95 160 V430 H265 V160" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="350" width="80" height="80" rx="0" fill="#d97706" stroke="#92400e" stroke-width="3"/><text x="180.0" y="125" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">A</text><path d="M380 160 V430 H640 V160" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="425" y="350" width="80" height="80" rx="0" fill="#d97706" stroke="#92400e" stroke-width="3"/><text x="510.0" y="125" font-size="29" fill="#17324d" text-anchor="middle" font-weight="500">B</text><text x="38" y="535" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">Kubus kayu yang sama dipindahkan biasa; tanpa</text><text x="38" y="566" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">pemanasan atau kerusakan.</text></g></svg>