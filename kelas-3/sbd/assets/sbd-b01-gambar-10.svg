<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Umpan balik karya</title><desc id="desc">Karya daun di tengah, komentar rinci dan sopan di kiri, serta komentar merendahkan di kanan.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="245" y="95" width="150" height="190" rx="8" fill="#fefce8" stroke="#64748b" stroke-width="5"/><path d="M320 245 Q255 175 320 120 Q385 175 320 245Z" fill="#86efac" stroke="#15803d" stroke-width="5"/><path d="M320 125 L320 242" stroke="#15803d" stroke-width="4"/><rect x="38" y="85" width="185" height="145" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="55" y="123" font-family="sans-serif" font-size="18" font-weight="700" fill="#166534"><tspan x="55" dy="0">Daunnya jelas.</tspan><tspan x="55" dy="29">Rapikan lem</tspan><tspan x="55" dy="29">di tepi.</tspan></text><rect x="420" y="105" width="170" height="95" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="468" y="162" font-family="sans-serif" font-size="28" font-weight="700" fill="#991b1b">Jelek!</text></svg>