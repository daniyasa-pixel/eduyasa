<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><rect width="800" height="400" rx="24" fill="#eff6ff"/><text x="400" y="45" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#1e3a8a">Siklus Hidup yang Menakjubkan — Kartu 2</text><g><rect x="40" y="70" width="340" height="120" rx="18" fill="white" stroke="#93c5fd"/><text x="210" y="122" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#1d4ed8">Kupu-kupu dewasa</text><text x="210" y="154" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#334155">dapat berkembang biak</text></g><g><rect x="430" y="70" width="340" height="120" rx="18" fill="white" stroke="#93c5fd"/><text x="600" y="122" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#1d4ed8">Berudu</text><text x="600" y="154" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#334155">anak katak yang hidup di air</text></g><g><rect x="40" y="220" width="340" height="120" rx="18" fill="white" stroke="#93c5fd"/><text x="210" y="272" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#1d4ed8">Katak dewasa</text><text x="210" y="304" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#334155">dapat hidup di darat dan air</text></g><g><rect x="430" y="220" width="340" height="120" rx="18" fill="white" stroke="#93c5fd"/><text x="600" y="272" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#1d4ed8">Biji</text><text x="600" y="304" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#334155">dapat tumbuh menjadi tumbuhan</text></g></svg>