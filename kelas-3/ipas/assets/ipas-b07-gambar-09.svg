<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc"><title id="title">Rute dan izin melintas</title><desc id="desc">Denah jalur yang diizinkan: rumah A ke simpang B, lalu sekolah C. Jalur lurus A ke C melewati kebun pribadi berpagar dan ditandai tidak boleh dilalui. Utara di atas, tidak berskala.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="720" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Rute dan izin melintas</text><path d="M130 470 H570 V170" fill="none" stroke="#15803d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 450 L550 190" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="225" y="275" width="255" height="125" rx="12" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><text x="352" y="310" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">Kebun pribadi</text><text x="352" y="341" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">berpagar. Tidak</text><text x="352" y="372" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">boleh dilalui.</text><rect x="40" y="438" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="130" y="478" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">A Rumah</text><rect x="480" y="438" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="570" y="478" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">B Simpang</text><rect x="480" y="138" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="570" y="178" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">C Sekolah</text><circle cx="120" cy="170" r="70" fill="white"/><text x="120" y="122" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">U</text><text x="175" y="177" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">T</text><text x="120" y="232" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">S</text><text x="65" y="177" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">B</text><path d="M120 170 L120.0 135.35" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="590" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Garis hijau: jalan yang diizinkan. Garis merah:</text><text x="38" y="621" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">lintasan terlarang. Tidak berskala.</text></g></svg>