<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">Bagan energi senter</title><desc id="desc">Bagan senter: A baterai di awal; panah ke B sambungan kabel tertutup; panah ke C lampu menyala. Rangkaian skematis, bukan petunjuk merakit.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="700" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Bagan energi senter</text><rect x="24" y="80" width="672" height="150" rx="18" fill="#dcfce7" stroke="none" stroke-width="3"/><text x="48" y="115" font-size="29" fill="#17324d" text-anchor="start" font-weight="750">A</text><g transform="translate(117 95)"><rect x="14" y="35" width="89" height="54" rx="8" fill="#86efac" stroke="#166534" stroke-width="3"/><rect x="103" y="49" width="10" height="26" rx="3" fill="#166534" stroke="none" stroke-width="3"/><text x="35" y="71" font-size="27" fill="#17324d" text-anchor="start" font-weight="500">−</text><text x="71" y="71" font-size="27" fill="#17324d" text-anchor="start" font-weight="500">+</text></g><text x="290" y="155" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">Baterai.</text><path d="M670 232 L670 249 M663 240 L670 249 L677 240" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="250" width="672" height="150" rx="18" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="48" y="285" font-size="29" fill="#17324d" text-anchor="start" font-weight="750">B</text><g transform="translate(117 265)"><path d="M12 62 L108 62" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g><text x="290" y="325" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">Sambungan kabel.</text><path d="M670 402 L670 419 M663 410 L670 419 L677 410" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="420" width="672" height="150" rx="18" fill="#dcfce7" stroke="none" stroke-width="3"/><text x="48" y="455" font-size="29" fill="#17324d" text-anchor="start" font-weight="750">C</text><g transform="translate(117 435)"><circle cx="60" cy="43" r="30" fill="#fde047"/><path d="M44 68 L44 90 L77 90 L77 68" fill="#cbd5e1" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 98 L76 98 M51 106 L69 106" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="290" y="495" font-size="25" fill="#17324d" text-anchor="start" font-weight="500">Lampu menyala.</text><text x="38" y="635" font-size="22" fill="#17324d" text-anchor="start" font-weight="500">Skema energi, bukan petunjuk merakit rangkaian.</text></g></svg>