<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Catatan dapat berubah</title><desc id="desc">A: Pekan lalu: jalan utara terbuka. B: Hari ini: jalan utara ditutup untuk perbaikan. Pendamping: Memeriksa jalur lain yang aman.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Catatan dapat berubah</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><polygon points="22,14 93,14 105,44 105,109 22,109" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><path d="M93 14 L77 42 L105 44 M33 63 L90 63 M33 78 L81 78" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">A</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Pekan lalu: jalan utara terbuka.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><circle cx="60" cy="58" r="45" fill="#ef4444"/><rect x="23" y="49" width="74" height="18" rx="2" fill="white" stroke="none" stroke-width="3"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">B</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Hari ini: jalan utara ditutup</text><text x="184" y="369" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">untuk perbaikan.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><rect x="6" y="12" width="106" height="66" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><polygon points="34,76 29,97 60,77" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="32" cy="43" r="5" fill="#2563eb"/><circle cx="59" cy="43" r="5" fill="#2563eb"/><circle cx="86" cy="43" r="5" fill="#2563eb"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Pendamping</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Memeriksa jalur lain yang aman.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>