  <rect x="8" y="8" width="374" height="44" rx="9" fill="#253d69"/>
  <text x="22" y="37" fill="#fff" font-family="sans-serif" font-size="21" font-weight="700">Bayu's plans</text>
  <rect x="12" y="60" width="366" height="38" rx="7" fill="#fff"/>
  <text x="22" y="85" fill="#253d69" font-family="sans-serif" font-size="16" font-weight="700">Monday</text>
  <text x="148" y="85" fill="#253d69" font-family="sans-serif" font-size="16">football</text>
  <rect x="12" y="104" width="366" height="38" rx="7" fill="#e3ecfa"/>
  <text x="22" y="129" fill="#253d69" font-family="sans-serif" font-size="16" font-weight="700">Wednesday</text>
  <text x="148" y="129" fill="#253d69" font-family="sans-serif" font-size="16">swimming</text>
  <rect x="12" y="148" width="366" height="38" rx="7" fill="#fff"/>
