<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc"><title id="title">Pengamatan tangan hangat</title><desc id="desc">Pengukuran contoh oleh guru: telapak tangan sebelum digosok 29 derajat Celsius, sesudah digosok perlahan 32 derajat Celsius; suhu ruangan tetap 28 derajat Celsius.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="560" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Pengamatan tangan hangat</text><rect x="30" y="80" width="270" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="165.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Pengukuran</text><rect x="300" y="80" width="390" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="495.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Suhu</text><rect x="30" y="142" width="268" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="165.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Sebelum digosok</text><rect x="300" y="142" width="388" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="495.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">29 °C</text><rect x="30" y="242" width="268" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="165.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Sesudah digosok</text><rect x="300" y="242" width="388" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="495.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">32 °C</text><rect x="30" y="342" width="268" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="165.0" y="380" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Ruangan</text><rect x="300" y="342" width="388" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="495.0" y="380" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">28 °C</text><text x="38" y="483" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Data contoh guru. Gosokan lembut; hentikan jika</text><text x="38" y="514" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">tidak nyaman.</text></g></svg>