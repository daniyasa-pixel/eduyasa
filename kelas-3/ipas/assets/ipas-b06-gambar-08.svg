<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 730" role="img" aria-labelledby="title desc"><title id="title">Periksa kebutuhan ruangan</title><desc id="desc">Ruangan kosong siang hari. A jendela memasukkan cahaya cukup; B lampu menyala; C kipas menyala tanpa kebutuhan lain; D kulkas menyala menyimpan makanan yang harus tetap dingin.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="730" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Periksa kebutuhan ruangan</text><rect x="35" y="90" width="650" height="460" rx="15" fill="white" stroke="#94a3b8" stroke-width="3"/><rect x="75" y="140" width="175" height="175" rx="4" fill="#bae6fd" stroke="none" stroke-width="3"/><path d="M163 142 V312 M76 227 H248" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="180" r="21" fill="#fbbf24"/><text x="75" y="122" font-size="28" fill="#17324d" text-anchor="start" font-weight="500">A</text><g transform="translate(333 143)"><circle cx="60" cy="43" r="30" fill="#fde047"/><path d="M44 68 L44 90 L77 90 L77 68" fill="#cbd5e1" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 98 L76 98 M51 106 L69 106" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="335" y="124" font-size="28" fill="#17324d" text-anchor="start" font-weight="500">B</text><g transform="translate(305 375)"><circle cx="60" cy="52" r="47" fill="#dbeafe"/><path d="M60 54 Q10 3 33 18 Q68 -3 60 54 M60 54 Q118 19 105 49 Q114 87 60 54 M60 54 Q61 118 33 99 Q4 84 60 54" fill="#38bdf8" stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="54" r="9" fill="#475569"/><rect x="54" y="97" width="12" height="18" rx="3" fill="#475569" stroke="none" stroke-width="3"/><rect x="30" y="111" width="60" height="8" rx="3" fill="#475569" stroke="none" stroke-width="3"/></g><text x="305" y="361" font-size="28" fill="#17324d" text-anchor="start" font-weight="500">C</text><rect x="512" y="280" width="119" height="233" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/><path d="M515 368 H628 M530 324 V350 M530 395 V425" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="262" font-size="28" fill="#17324d" text-anchor="start" font-weight="500">D</text><text x="38" y="590" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Ruang kosong; cahaya cukup. Kipas tidak</text><text x="38" y="621" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">diperlukan. Kulkas menyimpan makanan yang perlu</text><text x="38" y="652" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">tetap dingin.</text></g></svg>