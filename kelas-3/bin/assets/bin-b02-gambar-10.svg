<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Dua kalimat tentang buku</title><desc id="desc">KALIMAT 1: Di meja ada dua buku. AMATI DAN BEDAKAN: Jumlah atau penilaian? KALIMAT 2: Buku ini paling seru.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Dua kalimat tentang buku</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><g transform="translate(-1 5) scale(.68)"><path d="M12 25 Q35 15 58 27 L58 100 Q35 88 12 100 Z" fill="#93c5fd" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 27 Q82 15 108 25 L108 100 Q82 88 58 100 Z" fill="#fde68a" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 40 L46 39 M22 53 L46 52 M72 40 L96 39 M72 53 L96 52" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(41 36) scale(.68)"><path d="M12 25 Q35 15 58 27 L58 100 Q35 88 12 100 Z" fill="#93c5fd" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 27 Q82 15 108 25 L108 100 Q82 88 58 100 Z" fill="#fde68a" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 40 L46 39 M22 53 L46 52 M72 40 L96 39 M72 53 L96 52" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">KALIMAT 1</text><text x="184" y="157" font-size="26" fill="#