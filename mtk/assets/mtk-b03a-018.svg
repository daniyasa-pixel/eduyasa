<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Dua kubus disatukan</title><desc id="desc">Dua kubus rusuk 3 cm berdampingan membentuk balok panjang 6 cm, lebar 3 cm, dan tinggi 3 cm.</desc><rect width="640" height="400" rx="16" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="24" text-anchor="middle" fill="#172033">Dua kubus disatukan</text><polygon points="170,180 400,180 400,310 170,310" fill="#dbeafe" stroke="#172033" stroke-width="2"/><polygon points="170,180 400,180 480,110 250,110" fill="#bfdbfe" stroke="#172033" stroke-width="2"/><polygon points="400,180 400,310 480,240 480,110" fill="#93c5fd" stroke="#172033" stroke-width="2"/><text x="285" y="345" font-size="22" text-anchor="middle" fill="#172033">3 cm + 3 cm</text><text x="460" y="300" font-size="22" text-anchor="middle" fill="#172033">3 cm</text><text x="115" y="250" font-size="22" text-anchor="middle" fill="#172033">3 cm</text><text x="320" y="70" font-size="22" text-anchor="middle" fill="#172033">Dua kubus identik berdampingan</text><text x="320" y="382" font-size="18" text-anchor="middle" fill="#172033">Sketsa tidak harus berskala</text><line x1="285" y1="180" x2="285" y2="310" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/><line x1="285" y1="180" x2="365" y2="110" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/></g></svg>
