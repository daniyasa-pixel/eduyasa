<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Menilai peluang pada tabel</title><desc id="desc">Tabel undian: enam kupon pensil, tiga kupon penghapus, dan satu kupon buku.</desc><rect width="640" height="400" rx="16" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="24" text-anchor="middle" fill="#172033">Menilai peluang pada tabel</text><rect x="40.0" y="75" width="280.0" height="55" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="180.0" y="110" font-size="20" text-anchor="middle" fill="#172033">Hadiah</text><rect x="320.0" y="75" width="280.0" height="55" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="460.0" y="110" font-size="20" text-anchor="middle" fill="#172033">Jumlah kupon</text><rect x="40.0" y="130" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="180.0" y="165" font-size="20" text-anchor="middle" fill="#172033">Pensil</text><rect x="320.0" y="130" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="460.0" y="165" font-size="20" text-anchor="middle" fill="#172033">6</text><rect x="40.0" y="185" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="180.0" y="220" font-size="20" text-anchor="middle" fill="#172033">Penghapus</text><rect x="320.0" y="185" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="460.0" y="220" font-size="20" text-anchor="middle" fill="#172033">3</text><rect x="40.0" y="240" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="180.0" y="275" font-size="20" text-anchor="middle" fill="#172033">Buku</text><rect x="320.0" y="240" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="460.0" y="275" font-size="20" text-anchor="middle" fill="#172033">1</text></g></svg>
