<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Perbandingan jumlah siswa per guru</title><desc id="desc">Kelompok A berisi sepuluh siswa dan kelompok B empat belas siswa untuk setiap guru.</desc>
