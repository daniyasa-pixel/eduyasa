<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Cara menjemur kain</title><desc id="desc">Dua kain sama jenis, ukuran, dan kebasahan awal: A dibentangkan kering setelah 40 menit; B dilipat kering setelah 90 menit. Suhu dan aliran udara sama, diamati guru.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="460" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Cara menjemur kain</text><rect x="30" y="80" width="160" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="110.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Kain</text><rect x="190" y="80" width="260" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="320.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Keadaan</text><rect x="450" y="80" width="240" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="570.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Waktu kering</text><rect x="30" y="142" width="158" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="110.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">A</text><rect x="190" y="142" width="258" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="320.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Dibentangkan</text><rect x="450" y="142" width="238" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="570.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">40 menit</text><rect x="30" y="242" width="158" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="110.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">B</text><rect x="190" y="242" width="258" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="320.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Dilipat</text><rect x="450" y="242" width="238" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="570.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">90 menit</text><text x="38" y="383" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Jenis, ukuran, kebasahan awal, suhu dan aliran</text><text x="38" y="414" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">udara sama.</text></g></svg>