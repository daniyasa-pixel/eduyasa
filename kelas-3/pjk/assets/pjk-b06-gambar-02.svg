<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Zona latihan kolam</title><desc id="desc">Kolam dibagi menjadi zona dangkal untuk pemula dan zona dalam yang dilarang tanpa izin.</desc>
<rect width="640" height="360" rx="24" fill="#eef8ff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#2474a6" stroke-width="3"/>
<rect x="70" y="92" width="500" height="180" rx="18" fill="#42bff5"/><rect x="330" y="92" width="240" height="180" rx="0" fill="#0874b7"/><line x1="330" y1="92" x2="330" y2="272" stroke="#fff" stroke-width="5" stroke-dasharray="12 10"/><text x="200" y="145" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#083d5a">DANGKAL</text><text x="200" y="181" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#083d5a">latihan pemula</text><text x="450" y="145" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#fff">DALAM</text><text x="450" y="181" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">tanpa izin: dilarang</text><path d="M105 228h190" stroke="#fff" stroke-width="8"/><text x="320" y="318" text-anchor="middle" font-family="sans-serif" font-size="20">Ikuti zona yang ditetapkan pengawas</text>
</svg>