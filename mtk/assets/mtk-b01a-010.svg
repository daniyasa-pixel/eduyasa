<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Mengurutkan panjang pita</title><desc id="desc">Tabel panjang pita P 0,8 m, Q 0,75 m, dan R 0,85 m.</desc><rect width="640" height="400" rx="16" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="38" font-size="24" text-anchor="middle" fill="#172033">Mengurutkan panjang pita</text><rect x="40.0" y="75" width="280.0" height="55" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="180.0" y="110" font-size="20" text-anchor="middle" fill="#172033">Pita</text><rect x="320.0" y="75" width="280.0" height="55" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="460.0" y="110" font-size="20" text-anchor="middle" fill="#172033">Panjang (m)</text><rect x="40.0" y="130" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="180.0" y="165" font-size="20" text-anchor="middle" fill="#172033">P</text><rect x="320.0" y="130" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="460.0" y="165" font-size="20" text-anchor="middle" fill="#172033">0,8</text><rect x="40.0" y="185" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="180.0" y="220" font-size="20" text-anchor="middle" fill="#172033">Q</text><rect x="320.0" y="185" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="460.0" y="220" font-size="20" text-anchor="middle" fill="#172033">0,75</text><rect x="40.0" y="240" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="180.0" y="275" font-size="20" text-anchor="middle" fill="#172033">R</text><rect x="320.0" y="240" width="280.0" height="55" fill="#fff" stroke="#172033" stroke-width="2"/><text x="460.0" y="275" font-size="20" text-anchor="middle" fill="#172033">0,85</text></g></svg>
