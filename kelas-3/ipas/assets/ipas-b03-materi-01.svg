<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><rect width="800" height="400" rx="24" fill="#eff6ff"/><text x="400" y="45" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#1e3a8a">Peduli dan Berbagi — Kartu 1</text><g><rect x="40" y="70" width="340" height="120" rx="18" fill="white" stroke="#93c5fd"/><text x="210" y="122" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#1d4ed8">Empati</text><text x="210" y="154" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#334155">memahami perasaan orang lain</text></g><g><rect x="430" y="70" width="340" height="120" rx="18" fill="white" stroke="#93c5fd"/><text x="600" y="122" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#1d4ed8">Berbagi</text><text x="600" y="154" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#334155">memberikan sebagian yang dimiliki</text></g><g><rect x="40" y="220" width="340" height="120" rx="18" fill="white" stroke="#93c5fd"/><text x="210" y="272" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#1d4ed8">Gotong royong</text><text x="210" y="304" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#334155">bekerja bersama untuk tujuan baik</text></g><g><rect x="430" y="220" width="340" height="120" rx="18" fill="white" stroke="#93c5fd"/><text x="600" y="272" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#1d4ed8">Tolong-menolong</text><text x="600" y="304" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#334155">saling membantu saat diperlukan</text></g></svg>