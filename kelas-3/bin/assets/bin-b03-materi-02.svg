<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Cerita dan percakapan yang baik</title><desc id="desc">URUTKAN: Awal → usaha → hasil. TULIS DENGAN TEPAT: Pada hari Senin Putri berlatih. BERDISKUSI: Bertanya sopan, dengarkan teman.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Cerita dan percakapan yang baik</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><path d="M27 110 L27 12" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="31,15 107,15 89,38 107,62 31,62" fill="#fb7185" stroke="none" stroke-width="3"/><path d="M52 36 L62 46 L81 25" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">URUTKAN</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Awal → usaha → hasil.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><polygon points="20,95 76,15 93,27 37,107" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><polygon points="20,95 14,115 37,107" fill="#ffedd5" stroke="#92400e" stroke-width="3"/><path d="M69 25 L84 36" fill="none" stroke="#fb7185" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">TULIS DENGAN TEPAT</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Pada hari Senin Putri berlatih.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><path d="M32 101 L22 62 Q22 52 31 57 L42 72 L42 21 Q42 10 51 18 L53 52 L56 13 Q58 4 66 15 L67 53 L73 20 Q80 13 84 23 L82 60 L92 36 Q101 31 104 41 L92 94 Q86 112 61 112 L44 111 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">BERDISKUSI</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Bertanya sopan, dengarkan teman.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>