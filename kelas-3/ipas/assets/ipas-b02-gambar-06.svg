<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Riwayat perjalanan keluarga</title><desc id="desc">1990: Dalam catatan, Bibi berangkat dengan sepeda. 2010: Dalam catatan, Bibi memakai bus. 2020: Dalam catatan, Bibi memakai kereta.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Riwayat perjalanan keluarga</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><g fill="none" stroke="#2563eb" stroke-width="5"><circle cx="28" cy="85" r="22"/><circle cx="91" cy="85" r="22"/><path d="M28 85L49 42L73 85H28L62 55L91 85M40 40H57M63 27H78L91 85"/></g></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">1990</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Dalam catatan, Bibi berangkat</text><text x="184" y="189" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">dengan sepeda.</text><path d="M670 247 L670 261 M662 255 L670 262 L678 255" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><rect x="10" y="25" width="100" height="70" rx="10" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><g fill="#bae6fd"><rect x="18" y="35" width="20" height="25"/><rect x="44" y="35" width="20" height="25"/><rect x="70" y="35" width="28" height="25"/></g><circle cx="31" cy="96" r="12" fill="#334155"/><circle cx="88" cy="96" r="12" fill="#334155"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">2010</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Dalam catatan, Bibi memakai bus.</text><path d="M670 427 L670 441 M662 435 L670 442 L678 435" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><rect x="12" y="18" width="96" height="78" rx="12" fill="#34d399" stroke="#065f46" stroke-width="3"/><rect x="23" y="31" width="74" height="30" fill="#dbeafe"/><path d="M23 96L12 115M96 96L107 115M8 108H112M8 118H112" stroke="#334155" stroke-width="5"/><circle cx="31" cy="77" r="7" fill="#fde047"/><circle cx="89" cy="77" r="7" fill="#fde047"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">2020</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Dalam catatan, Bibi memakai</text><text x="184" y="549" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">kereta.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>