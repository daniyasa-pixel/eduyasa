<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Refleksi karya</title><desc id="desc">Dua kartu catatan: pola titik berhasil dan rencana merapikan garis tepi.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="55" y="75" width="245" height="210" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><text x="82" y="122" font-family="sans-serif" font-size="21" font-weight="700" fill="#166534"><tspan x="82">BERHASIL</tspan><tspan x="82" dy="45" font-weight="400">Pola titikku</tspan><tspan x="82" dy="34" font-weight="400">sudah teratur.</tspan></text><rect x="340" y="75" width="245" height="210" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><text x="367" y="122" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e3a8a"><tspan x="367">BERIKUTNYA</tspan><tspan x="367" dy="45" font-weight="400">Aku akan</tspan><tspan x="367" dy="34" font-weight="400">merapikan garis.</tspan></text></svg>