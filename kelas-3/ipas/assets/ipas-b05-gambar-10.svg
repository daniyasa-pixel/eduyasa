<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Periksa sebelum memilih</title><desc id="desc">Hari ini 10 Mei 2026. Dua kemasan contoh: A masih utuh, tertulis baik digunakan sebelum 20 Juni 2026; B robek, tertulis baik digunakan sebelum 30 Juni 2026. Keduanya produk sama dan disimpan sesuai petunjuk.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Periksa sebelum memilih</text><text x="180" y="115" font-size="30" fill="#17324d" text-anchor="middle" font-weight="750">A</text><rect x="80" y="150" width="200" height="260" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="180" y="205" font-size="20" fill="#17324d" text-anchor="middle" font-weight="500">PRODUK CONTOH</text><text x="180" y="264" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">Baik digunakan</text><text x="180" y="295" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">sebelum</text><text x="180" y="338" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">20 Juni 2026</text><text x="180" y="460" font-size="25" fill="#17324d" text-anchor="middle" font-weight="500">Kemasan utuh</text><text x="540" y="115" font-size="30" fill="#17324d" text-anchor="middle" font-weight="750">B</text><rect x="440" y="150" width="200" height="260" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="540" y="205" font-size="20" fill="#17324d" text-anchor="middle" font-weight="500">PRODUK CONTOH</text><text x="540" y="264" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">Baik digunakan</text><text x="540" y="295" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">sebelum</text><text x="540" y="338" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">30 Juni 2026</text><path d="M640 170 L597 213 L640 243 Z" fill="#eff6ff" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="460" font-size="25" fill="#17324d" text-anchor="middle" font-weight="500">Kemasan robek</text><text x="38" y="525" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">Hari ini 10 Mei 2026. Produk sama; disimpan</text><text x="38" y="556" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">sesuai petunjuk. Kemasan bukan produk asli.</text></g></svg>