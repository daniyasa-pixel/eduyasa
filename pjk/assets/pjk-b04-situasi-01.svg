<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 4.1</title><desc id="d">Alya memilih bekal untuk kegiatan sekolah. Pilihan P: Memilih makanan pokok lauk sayur buah dan air sesuai kebutuhan. Pilihan Q: Memilih satu makanan saja untuk semua kebutuhan.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 4.1</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Alya memilih bekal untuk kegiatan sekolah.</text><circle cx="350" cy="280" r="125" fill="#fff" stroke="#24334b" stroke-width="2"/><path d="M 350 155 A125 125 0 0 0 350 405 L350 280 Z" fill="#bbf7d0" stroke="#24334b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 155 A125 125 0 0 1 350 405 L350 280 Z" fill="#ffedd5" stroke="#24334b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="350" y1="155" x2="350" y2="405" stroke="#24334b" stroke-width="3"/><text x="286" y="250" font-size="20" text-anchor="middle" fill="#24334b">Sayur</text><text x="286" y="300" font-size="20" text-anchor="middle" fill="#24334b">dan buah</text><text x="414" y="250" font-size="20" text-anchor="middle" fill="#24334b">Pokok</text><text x="414" y="300" font-size="20" text-anchor="middle" fill="#24334b">dan lauk</text><rect x="535" y="210" width="55" height="120" rx="9" fill="#bfdbfe" stroke="#24334b" stroke-width="2"/><text x="561" y="370" font-size="20" text-anchor="middle" fill="#24334b">Air</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Memilih makanan pokok</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">lauk sayur buah dan air</text><text x="55" y="588" font-size="22" text-anchor="start" fill="#24334b">sesuai kebutuhan</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Memilih satu makanan saja</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">untuk semua kebutuhan</text></g></svg>
