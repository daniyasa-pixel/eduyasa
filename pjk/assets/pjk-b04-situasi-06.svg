<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 4.6</title><desc id="d">Farah membaca label minuman dua sajian per kemasan. Pilihan P: Menganggap angka per sajian pasti sama dengan seluruh kemasan. Pilihan Q: Menghubungkan angka zat gizi dengan jumlah sajian yang diminum.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 4.6</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Farah membaca label minuman dua sajian per kemasan.</text><rect x="180" y="175" width="360" height="215" rx="10" fill="#fff" stroke="#24334b" stroke-width="2"/><text x="360" y="220" font-size="24" text-anchor="middle" fill="#24334b">Contoh label</text><text x="360" y="265" font-size="23" text-anchor="middle" fill="#24334b">2 sajian per kemasan</text><text x="360" y="310" font-size="23" text-anchor="middle" fill="#24334b">Gula: 5 g per sajian</text><text x="360" y="355" font-size="22" text-anchor="middle" fill="#24334b">Baca dasar jumlahnya</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Menganggap angka per</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">sajian pasti sama dengan</text><text x="55" y="588" font-size="22" text-anchor="start" fill="#24334b">seluruh kemasan</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Menghubungkan angka zat</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">gizi dengan jumlah sajian</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">yang diminum</text></g></svg>
