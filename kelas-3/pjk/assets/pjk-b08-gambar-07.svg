<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Catatan air minum</title><desc id="desc">Botol berkapasitas 600 mililiter penuh pagi hari dan tersisa 200 mililiter setelah bermain.</desc><rect width="640" height="360" rx="24" fill="#f6fbff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#287da8" stroke-width="3"/><text x="320" y="55" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700">Catatan botol</text><rect x="125" y="90" width="120" height="190" rx="22" fill="#dbeafe" stroke="#287da8" stroke-width="5"/><rect x="395" y="90" width="120" height="190" rx="22" fill="#fff" stroke="#287da8" stroke-width="5"/><rect x="400" y="215" width="110" height="60" rx="15" fill="#8ecae6"/><text x="185" y="315" text-anchor="middle" font-family="sans-serif" font-size="19">pagi: 600 mL</text><text x="455" y="315" text-anchor="middle" font-family="sans-serif" font-size="19">sisa: 200 mL</text></svg>