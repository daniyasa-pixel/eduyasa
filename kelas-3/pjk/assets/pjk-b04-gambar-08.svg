<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Tahapan latihan kangkang</title><desc id="desc">A garis lantai, B rintangan rendah, C peti lebih tinggi</desc><rect width="720" height="400" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:20px;font-weight:700}.s{font-size:16px}.line{stroke:#2563eb;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#7c3aed;stroke-width:5;fill:none;stroke-dasharray:12 10}.person{fill:#bfdbfe;stroke:#1d4ed8;stroke-width:4}.safe{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.warn{fill:#fee2e2;stroke:#dc2626;stroke-width:3}</style><text class="h" x="30" y="42">Mulai dari tahap yang sesuai</text><rect x="35" y="75" width="195" height="270" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="l" x="123" y="110">A</text><line x1="80" y1="285" x2="185" y2="285" stroke="#16a34a" stroke-width="8"/><text class="s" x="85" y="325">garis lantai</text><circle class="person" cx="133" cy="155" r="25"/></svg><rect x="265" y="75" width="195" height="270" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="l" x="353" y="110">B</text><rect x="320" y="250" width="90" height="35" fill="#fde68a" stroke="#92400e" stroke-width="3"/><text class="s" x="310" y="325">rintangan rendah</text><circle class="person" cx="363" cy="155" r="25"/></svg><rect x="495" y="75" width="195" height="270" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="l" x="583" y="110">C</text><rect x="545" y="185" width="100" height="100" fill="#fca5a5" stroke="#991b1b" stroke-width="3"/><text class="s" x="553" y="325">peti tinggi</text><circle class="person" cx="593" cy="155" r="25"/></svg></svg>