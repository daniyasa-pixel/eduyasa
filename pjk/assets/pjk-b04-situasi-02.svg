<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 4.2</title><desc id="d">Bima mencari sumber tenaga pada bekalnya. Pilihan P: Menganggap air putih mengandung energi yang sama dengan nasi. Pilihan Q: Memilih makanan pokok seperti nasi jagung atau kentang.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 4.2</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Bima mencari sumber tenaga pada bekalnya.</text><ellipse cx="360" cy="300" rx="150" ry="65" fill="#fff" transform="rotate(0 360 300)"/><path d="M210 300 Q360 420 510 300" fill="#bfdbfe" stroke="#24334b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="290" cy="280" rx="13" ry="5" fill="#f3d39d" transform="rotate(20 290 280)"/><ellipse cx="325" cy="280" rx="13" ry="5" fill="#f3d39d" transform="rotate(20 325 280)"/><ellipse cx="360" cy="280" rx="13" ry="5" fill="#f3d39d" transform="rotate(20 360 280)"/><ellipse cx="395" cy="280" rx="13" ry="5" fill="#f3d39d" transform="rotate(20 395 280)"/><ellipse cx="430" cy="280" rx="13" ry="5" fill="#f3d39d" transform="rotate(20 430 280)"/><ellipse cx="290" cy="305" rx="13" ry="5" fill="#f3d39d" transform="rotate(20 290 305)"/><ellipse cx="325" cy="305" rx="13" ry="5" fill="#f3d39d" transform="rotate(20 325 305)"/><ellipse cx="360" cy="305" rx="13" ry="5" fill="#f3d39d" transform="rotate(20 360 305)"/><ellipse cx="395" cy="305" rx="13" ry="5" fill="#f3d39d" transform="rotate(20 395 305)"/><ellipse cx="430" cy="305" rx="13" ry="5" fill="#f3d39d" transform="rotate(20 430 305)"/><text x="360" y="395" font-size="23" text-anchor="middle" fill="#24334b">Contoh makanan pokok</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Menganggap air putih</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">mengandung energi yang</text><text x="55" y="588" font-size="22" text-anchor="start" fill="#24334b">sama dengan nasi</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Memilih makanan pokok</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">seperti nasi jagung atau</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">kentang</text></g></svg>
