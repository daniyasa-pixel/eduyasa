<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Lapisan kedalaman akuarium mini</title><desc id="desc">Empat lapisan dari depan ke belakang: rumput A, ikan B, batu C, dan latar D.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="320" y="52" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">AKUARIUM MINI — LAPISAN RUANG</text><path d="M45 300 H595" stroke="#475569" stroke-width="3"/><rect x="60" y="90" width="520" height="200" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/><rect x="75" y="105" width="490" height="55" fill="#bae6fd"/><text x="520" y="135" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">D — latar</text><ellipse cx="440" cy="245" rx="48" ry="22" fill="#94a3b8"/><text x="440" y="250" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">C</text><ellipse cx="300" cy="195" rx="65" ry="34" fill="#fb923c"/><polygon points="355,195 400,160 400,230" fill="#f97316"/><text x="300" y="202" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">B</text><path d="M120 280 Q115 220 130 180 M145 280 Q150 215 165 175 M175 280 Q175 230 195 195" fill="none" stroke="#16a34a" stroke-width="12" stroke-linecap="round"/><text x="150" y="315" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">A — depan</text><path d="M150 330 H320 H440 H520" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/></svg>