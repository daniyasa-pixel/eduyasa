<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" role="img" aria-labelledby="title desc"><title id="title">Perubahan bentuk katak</title><desc id="desc">Urutan katak: A telur; B berudu berekor tanpa kaki yang tampak; C berudu berkaki dengan ekor panjang; D katak berkaki tanpa ekor.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="704" rx="24" fill="#f0fdfa"/><text x="360" y="40" font-size="28" text-anchor="middle" fill="#17324d">Perubahan bentuk katak</text><rect x="24" y="64" width="672" height="132" rx="18" fill="#dcfce7"/><text x="45" y="101" font-size="25" text-anchor="start" fill="#17324d">A</text><g transform="translate(135 70) scale(.95)"><circle cx="30" cy="50" r="12" fill="#d1fae5"/><circle cx="30" cy="50" r="5" fill="#334155"/><circle cx="58" cy="42" r="12" fill="#d1fae5"/><circle cx="58" cy="42" r="5" fill="#334155"/><circle cx="86" cy="53" r="12" fill="#d1fae5"/><circle cx="86" cy="53" r="5" fill="#334155"/><circle cx="47" cy="76" r="12" fill="#d1fae5"/><circle cx="47" cy="76" r="5" fill="#334155"/><circle cx="77" cy="79" r="12" fill="#d1fae5"/><circle cx="77" cy="79" r="5" fill="#334155"/></g><text x="270" y="108" font-size="25" text-anchor="start" fill="#17324d">Telur di air.</text><path d="M675 199 L675 212 M668 206 L675 213 L682 206" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="214" width="672" height="132" rx="18" fill="#dbeafe"/><text x="45" y="251" font-size="25" text-anchor="start" fill="#17324d">B</text><g transform="translate(135 220) scale(.95)"><ellipse cx="41" cy="57" rx="30" ry="23" fill="#769b51" stroke="#34594a" stroke-width="2"/><path d="M66 50 Q96 45 113 79 Q86 65 65 68 Z" fill="#a3bf73" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31" cy="51" r="4" fill="#17324d"/></g><text x="270" y="258" font-size="25" text-anchor="start" fill="#17324d">Ekor panjang; kaki belum</text><text x="270" y="289" font-size="25" text-anchor="start" fill="#17324d">tampak.</text><path d="M675 349 L675 362 M668 356 L675 363 L682 356" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="364" width="672" height="132" rx="18" fill="#fef3c7"/><text x="45" y="401" font-size="25" text-anchor="start" fill="#17324d">C</text><g transform="translate(135 370) scale(.95)"><ellipse cx="41" cy="57" rx="30" ry="23" fill="#769b51" stroke="#34594a" stroke-width="2"/><path d="M66 50 Q96 45 113 79 Q86 65 65 68 Z" fill="#a3bf73" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31" cy="51" r="4" fill="#17324d"/><path d="M47 74 L28 96 L16 89 M61 74 L78 98 L91 94" fill="none" stroke="#34594a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="408" font-size="25" text-anchor="start" fill="#17324d">Ekor masih panjang; kaki</text><text x="270" y="439" font-size="25" text-anchor="start" fill="#17324d">mulai tumbuh.</text><path d="M675 499 L675 512 M668 506 L675 513 L682 506" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="514" width="672" height="132" rx="18" fill="#dcfce7"/><text x="45" y="551" font-size="25" text-anchor="start" fill="#17324d">D</text><g transform="translate(135 520) scale(.95)"><ellipse cx="60" cy="68" rx="32" ry="25" fill="#65a30d" stroke="#34594a" stroke-width="2"/><circle cx="41" cy="45" r="14" fill="#a3e635"/><circle cx="79" cy="45" r="14" fill="#a3e635"/><circle cx="41" cy="43" r="5" fill="#17324d"/><circle cx="79" cy="43" r="5" fill="#17324d"/><path d="M33 77 L13 94 L34 98 M87 77 L107 94 L86 98 M47 84 L41 106 M73 84 L79 106" fill="none" stroke="#365314" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="558" font-size="25" text-anchor="start" fill="#17324d">Empat kaki; tidak berekor.</text><text x="360" y="692" font-size="21" text-anchor="middle" fill="#17324d">Baca urutan dari atas ke bawah.</text></g></svg>