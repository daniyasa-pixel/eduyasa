<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 5.5</title><desc id="d">Eka belajar tentang balutan penyangga. Pilihan P: Meminta orang dewasa terlatih menilai dan menangani balutan. Pilihan Q: Mengikat sekuat mungkin tanpa penilaian.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 5.5</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Eka belajar tentang balutan penyangga.</text><ellipse cx="300" cy="265" rx="70" ry="90" fill="#fff" transform="rotate(0 300 265)"/><ellipse cx="300" cy="265" rx="35" ry="50" fill="#cbd5e1" transform="rotate(0 300 265)"/><rect x="330" y="245" width="150" height="115" rx="5" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><text x="360" y="400" font-size="22" text-anchor="middle" fill="#24334b">Penanganan oleh orang terlatih</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Meminta orang dewasa</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">terlatih menilai dan</text><text x="55" y="588" font-size="22" text-anchor="start" fill="#24334b">menangani balutan</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Mengikat sekuat mungkin</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">tanpa penilaian</text></g></svg>
