<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Mengenali sifat tiga wujud</title><desc id="desc">Padat: Bentuk dan volume relatif tetap. Cair: Bentuk mengikuti wadah; volume relatif tetap. Gas: Menyebar mengisi ruang yang tersedia.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Mengenali sifat tiga wujud</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><polygon points="20,95 76,15 93,27 37,107" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><polygon points="20,95 14,115 37,107" fill="#ffedd5" stroke="#92400e" stroke-width="3"/><path d="M69 25 L84 36" fill="none" stroke="#fb7185" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Padat</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Bentuk dan volume relatif tetap.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><path d="M61 8 Q12 61 25 89 Q42 121 76 106 Q117 87 61 8 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 79 Q36 94 51 97" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Cair</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Bentuk mengikuti wadah; volume</text><text x="184" y="369" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">relatif tetap.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><circle cx="14" cy="20" r="6" fill="#0284c7"/><circle cx="85" cy="18" r="6" fill="#0284c7"/><circle cx="42" cy="48" r="6" fill="#0284c7"/><circle cx="99" cy="76" r="6" fill="#0284c7"/><circle cx="17" cy="102" r="6" fill="#0284c7"/><circle cx="65" cy="99" r="6" fill="#0284c7"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Gas</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Menyebar mengisi ruang yang</text><text x="184" y="549" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">tersedia.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Titik gas adalah model, bukan warna udara.</text></g></svg>