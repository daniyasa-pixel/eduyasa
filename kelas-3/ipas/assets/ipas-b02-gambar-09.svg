<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t d"><title id="t">Jadwal kunjungan</title><desc id="d">Senin tanggal 4 membagi tugas, Rabu tanggal 6 meminta izin narasumber, Kamis tanggal 7 melakukan wawancara.</desc><g font-family="Arial"><rect x="0" y="0" width="720" height="390" rx="22" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="27" fill="#17324d" text-anchor="middle" font-weight="700">Jadwal kunjungan kelompok</text><rect x="25" y="75" width="670" height="60" rx="4" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="43" y="114" font-size="23" fill="#17324d" text-anchor="start" font-weight="700">Hari dan tanggal</text><text x="275" y="114" font-size="23" fill="#17324d" text-anchor="start" font-weight="700">Kegiatan</text><rect x="25" y="138" width="670" height="60" rx="4" fill="white" stroke="none" stroke-width="3"/><text x="43" y="177" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Senin, 4</text><text x="275" y="177" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Membagi tugas kelompok</text><rect x="25" y="201" width="670" height="60" rx="4" fill="white" stroke="none" stroke-width="3"/><text x="43" y="240" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Rabu, 6</text><text x="275" y="240" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Meminta izin narasumber</text><rect x="25" y="264" width="670" height="60" rx="4" fill="white" stroke="none" stroke-width="3"/><text x="43" y="303" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Kamis, 7</text><text x="275" y="303" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Melakukan wawancara</text><text x="360" y="370" font-size="18" fill="#17324d" text-anchor="middle" font-weight="500">Cuplikan jadwal; bulan tidak ditampilkan.</text></g></svg>