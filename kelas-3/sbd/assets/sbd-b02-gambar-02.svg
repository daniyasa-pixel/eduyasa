<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Dua komentar</title><desc id="desc">Kartu kiri berisi komentar spesifik tentang garis; kartu kanan hanya menyebut jelek.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="55" y="75" width="245" height="210" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><text x="78" y="120" font-family="sans-serif" font-size="20" font-weight="700" fill="#166534"><tspan x="78">Garis ombakmu</tspan><tspan x="78" dy="34">terlihat bergerak</tspan><tspan x="78" dy="34">karena bentuknya</tspan><tspan x="78" dy="34">berulang.</tspan></text><rect x="340" y="105" width="245" height="145" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/><text x="405" y="188" font-family="sans-serif" font-size="34" font-weight="700" fill="#991b1b">Jelek!</text></svg>