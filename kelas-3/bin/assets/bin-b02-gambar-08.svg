<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Mengapa aku senang?</title><desc id="desc">1: Nisa menanam biji. 2: Tunas mulai muncul. 3: Nisa merasa senang.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Mengapa aku senang?</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><rect x="7" y="83" width="106" height="29" rx="5" fill="#a16207" stroke="none" stroke-width="3"/><path d="M51 87 Q27 59 47 47 Q79 42 76 69 Q73 86 51 87 Z" fill="#fef3c7" stroke="#92400e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">1</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Nisa menanam biji.</text><path d="M670 247 L670 261 M662 255 L670 262 L678 255" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><rect x="35" y="77" width="54" height="35" rx="7" fill="#fb923c" stroke="none" stroke-width="3"/><path d="M62 77 L62 35" fill="none" stroke="#15803d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M61 57 Q16 50 34 24 Q61 30 61 57 Z" fill="#4ade80" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M63 47 Q106 40 90 17 Q67 19 63 47 Z" fill="#86