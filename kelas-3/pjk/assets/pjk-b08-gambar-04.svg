<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Empat pilar gizi seimbang</title><desc id="desc">Empat kotak: makanan beragam, hidup bersih, pemantauan pertumbuhan, dan satu kotak tanda tanya.</desc><rect width="640" height="360" rx="24" fill="#f6fbff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#287da8" stroke-width="3"/><text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700">Empat pilar</text><rect x="60" y="75" width="250" height="95" rx="14" fill="#dcfce7" stroke="#287da8" stroke-width="2"/><text x="185" y="130" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Makanan beragam</text><rect x="330" y="75" width="250" height="95" rx="14" fill="#dbeafe" stroke="#287da8" stroke-width="2"/><text x="455" y="130" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Hidup bersih</text><rect x="60" y="205" width="250" height="95" rx="14" fill="#fef3c7" stroke="#287da8" stroke-width="2"/><text x="185" y="260" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Pantau pertumbuhan</text><rect x="330" y="205" width="250" height="95" rx="14" fill="#fee2e2" stroke="#287da8" stroke-width="2"/><text x="455" y="260" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">?</text></svg>