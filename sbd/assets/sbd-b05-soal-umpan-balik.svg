<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Masukan untuk penyajian karya</title><desc id="desc">Poster dipajang bersama catatan yang menyarankan memperbesar huruf judul agar terbaca dari jauh.</desc><rect x="1" y="1" width="718" height="478" rx="20" fill="#fffdf8" stroke="#dce5ef" stroke-width="2"/><g font-family="Arial, sans-serif"><circle cx="35" cy="35" r="13" fill="#f5bf44" stroke="#24334b" stroke-width="2"/><text x="65" y="44" font-size="24" text-anchor="start" fill="#24334b">Masukan untuk penyajian karya</text><rect x="65" y="120" width="230" height="270" rx="5" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/><text x="180.0" y="148" font-size="23" text-anchor="middle" fill="#24334b">JAGA AIR</text><g transform="translate(180.0 287.4) scale(0.5)"><path d="M 0 50 C -60 15 -48 -50 0 -70 C 48 -50 60 15 0 50" fill="#0d9488" stroke="#24334b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="45" x2="0" y2="-55" stroke="#fffdf8" stroke-width="3"/><path d="M 0 10 L -23 -12 M 0 -10 L 25 -32" fill="none" stroke="#fffdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="77" y="358" width="206" height="18" rx="4" fill="#0d9488" stroke="#0d9488" stroke-width="2"/><rect x="350" y="145" width="300" height="180" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="375" y="188" font-size="22" text-anchor="start" fill="#24334b">Judul sulit terbaca</text><text x="375" y="217" font-size="22" text-anchor="start" fill="#24334b">dari jauh. Coba</text><text x="375" y="246" font-size="22" text-anchor="start" fill="#24334b">perbesar hurufnya.</text></g></svg>
