<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Periksa sebelum merawat</title><desc id="desc">Tiga kondisi: P tanah pot retak dan kering; Q air menggenang di pot; R batang bengkok karena angin.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#f0fdfa"/><text x="360" y="40" font-size="28" text-anchor="middle" fill="#17324d">Periksa sebelum merawat</text><rect x="24" y="80" width="672" height="166" rx="18" fill="#fff"/><text x="48" y="116" font-size="28" text-anchor="start" fill="#17324d">P</text><g transform="translate(103 112)"><path d="M8 85 L112 85 L98 112 L22 112 Z" fill="#b45309" stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 88 L40 100 L35 110 M70 87 L61 99 L81 109" fill="none" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M59 80 L59 25" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="36" cy="40" rx="24" ry="9" fill="#84cc16" stroke="#34594a" stroke-width="2"/></g><text x="255" y="148" font-size="25" text-anchor="start" fill="#17324d">Tanah retak dan kering.</text><rect x="24" y="262" width="672" height="166" rx="18" fill="#fff"/><text x="48" y="298" font-size="28" text-anchor="start" fill="#17324d">Q</text><g transform="translate(103 294)"><path d="M8 45 L112 45 L97 113 L23 113 Z" fill="#cbd5e1" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="55" width="87" height="21" rx="0" fill="#38bdf8"/><path d="M59 90 L59 13" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="80" cy="25" rx="21" ry="9" fill="#65a30d" stroke="#34594a" stroke-width="2"/></g><text x="255" y="330" font-size="25" text-anchor="start" fill="#17324d">Air menggenang di pot.</text><rect x="24" y="444" width="672" height="166" rx="18" fill="#fff"/><text x="48" y="480" font-size="28" text-anchor="start" fill="#17324d">R</text><g transform="translate(103 476)"><path d="M50 112 L50 75 Q50 40 86 36" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="93" cy="31" rx="21" ry="9" fill="#65a30d" stroke="#34594a" stroke-width="2"/><path d="M5 16 L53 16 M5 30 L38 30 M8 45 L44 45" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="255" y="512" font-size="25" text-anchor="start" fill="#17324d">Batang bengkok karena angin.</text></g></svg>