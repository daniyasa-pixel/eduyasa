<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Urutan membuat karya tiga dimensi</title><desc id="desc">Lima kotak berpanah: mengamati, merancang, memilih bahan aman, membentuk, dan meninjau.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="35" y="125" width="90" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="80" y="165" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">AMATI</text><path d="M129 170 H150 l-10 -9 m10 9 l-10 9" fill="none" stroke="#475569" stroke-width="4"/><rect x="155" y="125" width="90" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="200" y="165" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">RANCANG</text><path d="M249 170 H270 l-10 -9 m10 9 l-10 9" fill="none" stroke="#475569" stroke-width="4"/><rect x="275" y="125" width="90" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="320" y="165" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">PILIH BAHAN</text><path d="M369 170 H390 l-10 -9 m10 9 l-10 9" fill="none" stroke="#475569" stroke-width="4"/><rect x="395" y="125" width="90" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="440" y="165" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">BENTUK</text><path d="M489 170 H510 l-10 -9 m10 9 l-10 9" fill="none" stroke="#475569" stroke-width="4"/><rect x="515" y="125" width="90" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="560" y="165" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">TINJAU</text><text x="320"