<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Hasil kegiatan bersama</title><desc id="desc">Sebelum: Buku dan mainan menutupi jalan di ruang keluarga. Kegiatan: Keluarga berbagi tugas merapikan. Sesudah: Jalan di ruang keluarga kembali terbuka.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Hasil kegiatan bersama</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><rect x="18" y="34" width="87" height="77" rx="17" fill="#818cf8" stroke="#4338ca" stroke-width="3"/><path d="M42 35 L42 20 Q61 2 80 20 L80 35" fill="none" stroke="#4338ca" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="33" y="67" width="57" height="32" rx="8" fill="#c7d2fe" stroke="none" stroke-width="3"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Sebelum</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Buku dan mainan menutupi jalan di</text><text x="184" y="189" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">ruang keluarga.</text><path d="M670 247 L670 261 M662 255 L670 262 L678 255" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><path d="M32 101 L22 62 Q22 52 31 57 L42 72 L42 21 Q42 10 51 18 L53 52 L56 13 Q58 4 66 15 L67 53 L73 20 Q80 13 84 23 L82 60 L92 36 Q101 31 104 41 L92 94 Q86 112 61 112 L44 111 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Kegiatan</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Keluarga berbagi tugas merapikan.</text><path d="M670 427 L670 441 M662 435 L670 442 L678 435" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><polygon points="8,54 60,11 112,54" fill="#fb7185" stroke="#9f1239" stroke-width="3"/><rect x="21" y="54" width="78" height="59" rx="3" fill="#fef3c7" stroke="none" stroke-width="3"/><rect x="50" y="75" width="24" height="38" rx="2" fill="#b45309" stroke="none" stroke-width="3"/><rect x="28" y="66" width="15" height="18" rx="2" fill="#7dd3fc" stroke="none" stroke-width="3"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Sesudah</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Jalan di ruang keluarga kembali</text><text x="184" y="549" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">terbuka.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>