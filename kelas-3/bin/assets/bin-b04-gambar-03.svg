<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Pengingat keran taman</title><desc id="desc">SESUDAH DIGUNAKAN: Tutup keran sampai rapat. PERIKSA LAGI: Jangan biarkan air menetes. PESAN KURA-KURA: Mari hemat air!</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Pengingat keran taman</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><path d="M15 37 L15 58 L75 58 L75 84 L100 84 L100 41 L68 41 L68 24 L45 24 L45 37 Z" fill="#94a3b8" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 24 L55 8 M35 9 L76 9" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">SESUDAH DIGUNAKAN</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Tutup keran sampai rapat.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><path d="M61 8 Q12 61 25 89 Q42 121 76 106 Q117 87 61 8 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 79 Q36 94 51 97" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">PERIKSA LAGI</text><text x="184" y="337" font-size="