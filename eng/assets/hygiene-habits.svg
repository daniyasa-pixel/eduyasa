<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" rx="28" fill="#f0fdf4"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#166534">MY DAILY HYGIENE HABITS</text><g font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#14532d"><g transform="translate(80 110)"><circle cx="85" cy="75" r="58" fill="#bbf7d0"/><rect x="60" y="50" width="50" height="70" rx="10" fill="#fff"/><path d="M72 50 V35 H98 V50" stroke="#16a34a" stroke-width="8" fill="none"/><text x="85" y="175">Brush teeth</text></g><g transform="translate(275 110)"><circle cx="85" cy="75" r="58" fill="#bbf7d0"/><circle cx="85" cy="65" r="28" fill="#fbbf24"/><path d="M55 35 L115 95 M115 35 L55 95" stroke="#166534" stroke-width="7"/><text x="85" y="175">Comb hair</text></g><g transform="translate(470 110)"><circle cx="85" cy="75" r="58" fill="#bbf7d0"/><rect x="60" y="45" width="50" height="60" rx="10" fill="#f9a8d4"/><path d="M70 45 V30 M85 45 V25 M100 45 V30" stroke="#166534" stroke-width="7"/><text x="85" y="175">Clip nails</text></g><g transform="translate(665 110)"><circle cx="85" cy="75" r="58" fill="#bbf7d0"/><path d="M45 60 Q85 20 125 60 L115 110 H55Z" fill="#60a5fa"/><path d="M60 70 Q85 95 110 70" stroke="#fff" stroke-width="8" fill="none"/><text x="85" y="175">Take a shower</text></g></g><text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="23" fill="#166534">Clean body • Clean teeth • Clean clothes</text><text x="450" y="435" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534">Good habits help us stay fresh and healthy</text></svg>