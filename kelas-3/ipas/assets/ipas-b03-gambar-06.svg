<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Pembagian kegiatan rumah</title><desc id="desc">Ayah: Memasak. Ibu: Membantu memperbaiki kursi bersama orang dewasa lain. Anak: Merapikan alat belajar.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Pembagian kegiatan rumah</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><rect x="14" y="39" width="96" height="67" rx="12" fill="#fb923c" stroke="#c2410c" stroke-width="3"/><path d="M40 39 L40 21 Q62 4 84 21 L84 39" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="54" width="38" height="36" rx="7" fill="#fef3c7" stroke="none" stroke-width="3"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Ayah</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Memasak.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><polygon points="8,54 60,11 112,54" fill="#fb7185" stroke="#9f1239" stroke-width="3"/><rect x="21" y="54" width="78" height="59" rx="3" fill="#fef3c7" stroke="none" stroke-width="3"/><rect x="50" y="75" width="24" height="38" rx="2" fill="#b45309" stroke="none" stroke-width="3"/><rect x="28" y="66" width="15" height="18" rx="2" fill="#7dd3fc" stroke="none" stroke-width="3"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Ibu</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Membantu memperbaiki kursi</text><text x="184" y="369" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">bersama orang dewasa lain.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><path d="M12 25 Q35 15 58 27 L58 100 Q35 88 12 100 Z" fill="#93c5fd" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 27 Q82 15 108 25 L108 100 Q82 88 58 100 Z" fill="#fde68a" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 40 L46 39 M22 53 L46 52 M72 40 L96 39 M72 53 L96 52" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">Anak</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Merapikan alat belajar.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>