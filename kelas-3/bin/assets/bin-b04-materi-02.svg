<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Pesan dongeng menjadi tindakan</title><desc id="desc">DI TAMAN: Gunakan jalan setapak. SESUDAH MEMAKAI AIR: Tutup keran dengan rapat. DI MANA PUN: Buang sampah pada tempatnya.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="660" rx="24" fill="#edf6ff" stroke="none" stroke-width="3"/><circle cx="690" cy="15" r="65" fill="#dbeafe"/><circle cx="8" cy="645" r="57" fill="#ccfbf1"/><text x="360" y="36" font-size="27" fill="#17324d" text-anchor="middle" font-weight="750">Pesan dongeng menjadi tindakan</text><rect x="22" y="83" width="676" height="163" rx="20" fill="#dbeafe" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="166" r="65" fill="white"/><g transform="translate(43 105) scale(.95)"><rect x="8" y="10" width="104" height="103" rx="9" fill="#bbf7d0" stroke="none" stroke-width="3"/><polygon points="49,11 70,11 99,112 20,112" fill="#cbd5e1" stroke="none" stroke-width="3"/><path d="M59 20 L59 35 M59 51 L59 68 M59 84 L59 105" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="117" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">DI TAMAN</text><text x="184" y="157" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Gunakan jalan setapak.</text><rect x="22" y="263" width="676" height="163" rx="20" fill="#dcfce7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="346" r="65" fill="white"/><g transform="translate(43 285) scale(.95)"><path d="M15 37 L15 58 L75 58 L75 84 L100 84 L100 41 L68 41 L68 24 L45 24 L45 37 Z" fill="#94a3b8" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 24 L55 8 M35 9 L76 9" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="297" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">SESUDAH MEMAKAI AIR</text><text x="184" y="337" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Tutup keran dengan rapat.</text><rect x="22" y="443" width="676" height="163" rx="20" fill="#fef3c7" stroke="#cbd5e1" stroke-width="3"/><circle cx="100" cy="526" r="65" fill="white"/><g transform="translate(43 465) scale(.95)"><rect x="29" y="35" width="65" height="77" rx="7" fill="#34d399" stroke="#047857" stroke-width="3"/><rect x="21" y="23" width="81" height="14" rx="4" fill="#059669" stroke="none" stroke-width="3"/><rect x="45" y="12" width="33" height="11" rx="3" fill="#047857" stroke="none" stroke-width="3"/><path d="M49 51 L49 95 M74 51 L74 95" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="184" y="477" font-size="21" fill="#1d4ed8" text-anchor="start" font-weight="750">DI MANA PUN</text><text x="184" y="517" font-size="26" fill="#17324d" text-anchor="start" font-weight="600">Buang sampah pada tempatnya.</text><text x="360" y="645" font-size="20" fill="#475569" text-anchor="middle" font-weight="500">Amati gambar dan baca keterangannya.</text></g></svg>