<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 554" role="img" aria-labelledby="title desc"><title id="title">Catatan satu ayam</title><desc id="desc">Catatan satu ayam: 12 Juni telur yang sedang dierami; 13 Juni anak ayam baru menetas; 30 Juni anak ayam yang sama lebih besar. Tanggal menunjukkan waktu pengamatan, bukan lama seluruh daur.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="554" rx="24" fill="#f0fdfa"/><text x="360" y="40" font-size="28" text-anchor="middle" fill="#17324d">Catatan satu ayam</text><rect x="24" y="64" width="672" height="132" rx="18" fill="#dcfce7"/><text x="45" y="101" font-size="25" text-anchor="start" fill="#17324d">12 Juni</text><g transform="translate(135 70) scale(.95)"><ellipse cx="60" cy="65" rx="27" ry="37" fill="#fff7dd" stroke="#34594a" stroke-width="2"/></g><text x="270" y="108" font-size="25" text-anchor="start" fill="#17324d">Telur yang sedang dierami.</text><path d="M675 199 L675 212 M668 206 L675 213 L682 206" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="214" width="672" height="132" rx="18" fill="#dbeafe"/><text x="45" y="251" font-size="25" text-anchor="start" fill="#17324d">13 Juni</text><g transform="translate(135 220) scale(.95)"><circle cx="51" cy="72" r="28" fill="#fde047"/><circle cx="77" cy="46" r="20" fill="#facc15"/><circle cx="82" cy="42" r="3" fill="#17324d"/><path d="M95 45 L110 51 L95 56 Z" fill="#fb923c" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M41 97 L37 111 M60 97 L63 111" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="258" font-size="25" text-anchor="start" fill="#17324d">Anak ayam baru menetas.</text><path d="M675 349 L675 362 M668 356 L675 363 L682 356" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="364" width="672" height="132" rx="18" fill="#fef3c7"/><text x="45" y="401" font-size="25" text-anchor="start" fill="#17324d">30 Juni</text><g transform="translate(135 370) scale(1.05)"><circle cx="51" cy="72" r="28" fill="#fde047"/><circle cx="77" cy="46" r="20" fill="#facc15"/><circle cx="82" cy="42" r="3" fill="#17324d"/><path d="M95 45 L110 51 L95 56 Z" fill="#fb923c" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M41 97 L37 111 M60 97 L63 111" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="408" font-size="25" text-anchor="start" fill="#17324d">Anak ayam yang sama lebih</text><text x="270" y="439" font-size="25" text-anchor="start" fill="#17324d">besar.</text><text x="360" y="542" font-size="21" text-anchor="middle" fill="#17324d">Tanggal pengamatan, bukan lama seluruh daur.</text></g></svg>