<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Tanda tubuh saat latihan</title><desc id="desc">Empat kartu: hangat ringan, nyeri tajam, pusing, dan sesak tidak wajar.</desc><rect width="640" height="360" rx="24" fill="#f5fbff"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#2b78a6" stroke-width="3"/><text x="320" y="55" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Perhatikan tanda tubuh</text><rect x="65" y="90" width="240" height="75" rx="13" fill="#dcfce7" stroke="#166534" stroke-width="3"/><text x="185" y="136" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#166534">hangat ringan</text><rect x="335" y="90" width="240" height="75" rx="13" fill="#fee2e2" stroke="#991b1b" stroke-width="3"/><text x="455" y="136" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#991b1b">nyeri tajam</text><rect x="65" y="200" width="240" height="75" rx="13" fill="#fff7d6" stroke="#854d0e" stroke-width="3"/><text x="185" y="246" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#854d0e">pusing</text><rect x="335" y="200" width="240" height="75" rx="13" fill="#fee2e2" stroke="#991b1b" stroke-width="3"/><text x="455" y="246" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#991b1b">sesak tidak wajar</text><text x="320" y="325" text-anchor="middle" font-family="sans-serif" font-size="18">Mana yang masih dapat wajar?</text></svg>