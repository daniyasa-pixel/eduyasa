<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 3.6</title><desc id="d">Farah sering begadang sehingga mengantuk saat berlatih. Pilihan P: Mengganti tidur dengan minuman berenergi. Pilihan Q: Membicarakan rutinitas tidur teratur dengan keluarga.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 3.6</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Farah sering begadang sehingga mengantuk saat</text><text x="40" y="114" font-size="22" text-anchor="start" fill="#24334b">berlatih.</text><rect x="180" y="260" width="360" height="95" rx="10" fill="#bfdbfe" stroke="#24334b" stroke-width="2"/><rect x="190" y="230" width="80" height="40" rx="8" fill="#fff" stroke="#24334b" stroke-width="2"/><circle cx="525" cy="170" r="45" fill="#f5bf44" stroke="#24334b" stroke-width="2"/><text x="360" y="390" font-size="22" text-anchor="middle" fill="#24334b">Istirahat mendukung pemulihan</text><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Mengganti tidur dengan</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">minuman berenergi</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Membicarakan rutinitas</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">tidur teratur dengan</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">keluarga</text></g></svg>
