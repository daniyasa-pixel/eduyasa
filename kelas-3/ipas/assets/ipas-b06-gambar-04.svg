<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc"><title id="title">Catatan putaran kincir</title><desc id="desc">Pengamatan kincir yang sama selama 10 detik: P tanpa hembusan, nol putaran; Q hembusan pelan, delapan putaran; R hembusan lebih kuat, lima belas putaran. Guru mengatur hembusan aman.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="560" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Catatan putaran kincir</text><rect x="30" y="80" width="160" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="110.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Uji</text><rect x="190" y="80" width="260" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="320.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Hembusan</text><rect x="450" y="80" width="240" height="60" rx="0" fill="#1d4ed8" stroke="none" stroke-width="3"/><text x="570.0" y="118" font-size="24" fill="white" text-anchor="middle" font-weight="650">Putaran</text><rect x="30" y="142" width="158" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="110.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">P</text><rect x="190" y="142" width="258" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="320.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Tidak ada</text><rect x="450" y="142" width="238" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="570.0" y="180" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">0</text><rect x="30" y="242" width="158" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="110.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Q</text><rect x="190" y="242" width="258" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="320.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Pelan</text><rect x="450" y="242" width="238" height="98" rx="0" fill="#dbeafe" stroke="none" stroke-width="3"/><text x="570.0" y="280" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">8</text><rect x="30" y="342" width="158" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="110.0" y="380" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">R</text><rect x="190" y="342" width="258" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="320.0" y="380" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Lebih kuat</text><rect x="450" y="342" width="238" height="98" rx="0" fill="white" stroke="none" stroke-width="3"/><text x="570.0" y="380" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">15</text><text x="38" y="483" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">Kincir sama, waktu tiap uji 10 detik. Guru</text><text x="38" y="514" font-size="23" fill="#17324d" text-anchor="start" font-weight="500">mengatur hembusan aman.</text></g></svg>