<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="t d"><title id="t">Situasi belajar 1.6</title><desc id="d">Farah mendekati rintangan dalam lintasan latihan. Pilihan P: Menabrak rintangan supaya cepat. Pilihan Q: Memperlambat lalu berbelok melalui jalur yang disediakan.</desc><rect x="1" y="1" width="718" height="698" rx="18" fill="#fffdf8" stroke="#cbd5e1" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" text-anchor="start" fill="#24334b">Situasi belajar 1.6</text><text x="40" y="85" font-size="22" text-anchor="start" fill="#24334b">Farah mendekati rintangan dalam lintasan latihan.</text><path d="M 110 360 Q 220 170 330 330 T 580 230" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="230,215 206,270 254,270" fill="#f28b45" stroke="#24334b" stroke-width="2"/><polygon points="420,275 396,330 444,330" fill="#f28b45" stroke="#24334b" stroke-width="2"/><polygon points="550,185 526,240 574,240" fill="#f28b45" stroke="#24334b" stroke-width="2"/><rect x="35" y="445" width="330" height="215" rx="12" fill="#eff6ff" stroke="#24334b" stroke-width="2"/><circle cx="70" cy="480" r="21" fill="#2563eb" stroke="#24334b" stroke-width="2"/><text x="70" y="488" font-size="23" text-anchor="middle" fill="#fff">P</text><text x="55" y="530" font-size="22" text-anchor="start" fill="#24334b">Menabrak rintangan supaya</text><text x="55" y="559" font-size="22" text-anchor="start" fill="#24334b">cepat</text><rect x="385" y="445" width="330" height="215" rx="12" fill="#fff7ed" stroke="#24334b" stroke-width="2"/><circle cx="420" cy="480" r="21" fill="#f28b45" stroke="#24334b" stroke-width="2"/><text x="420" y="488" font-size="23" text-anchor="middle" fill="#fff">Q</text><text x="405" y="530" font-size="22" text-anchor="start" fill="#24334b">Memperlambat lalu</text><text x="405" y="559" font-size="22" text-anchor="start" fill="#24334b">berbelok melalui jalur</text><text x="405" y="588" font-size="22" text-anchor="start" fill="#24334b">yang disediakan</text></g></svg>
