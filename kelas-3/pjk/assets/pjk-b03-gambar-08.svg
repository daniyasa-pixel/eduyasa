<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Jalur tendangan</title><desc id="desc">Seorang anak masih berada di antara penendang dan gawang</desc><rect width="720" height="400" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.l{font-size:20px;font-weight:700}.s{font-size:16px}.line{stroke:#2563eb;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#7c3aed;stroke-width:5;fill:none;stroke-dasharray:12 10}.ball{fill:#f59e0b;stroke:#92400e;stroke-width:3}.person{fill:#bfdbfe;stroke:#1d4ed8;stroke-width:4}.safe{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.warn{fill:#fee2e2;stroke:#dc2626;stroke-width:3}</style><text class="h" x="30" y="42">Periksa jalur sebelum menendang</text><rect x="540" y="105" width="130" height="210" fill="none" stroke="#16a34a" stroke-width="8"/><circle class="person" cx="145" cy="190" r="35"/><circle class="ball" cx="190" cy="300" r="22"/><path class="dash" d="M220 295 L540 230"/><circle class="warn" cx="390" cy="245" r="42"/><text class="l" x="379" y="253">!</text><text class="s" x="300" y="350">jalur belum kosong</text></svg>