<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" role="img" aria-labelledby="title desc"><title id="title">Empat tahap kupu-kupu</title><desc id="desc">Urutan gambar kupu-kupu: A telur pada daun; B ulat memakan daun; C tubuh terbungkus melekat pada ranting; D kupu-kupu bersayap lebar.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="704" rx="24" fill="#f0fdfa"/><text x="360" y="40" font-size="28" text-anchor="middle" fill="#17324d">Empat tahap kupu-kupu</text><rect x="24" y="64" width="672" height="132" rx="18" fill="#dcfce7"/><text x="45" y="101" font-size="25" text-anchor="start" fill="#17324d">A</text><g transform="translate(135 70) scale(.95)"><ellipse cx="60" cy="65" rx="27" ry="37" fill="#fff7dd" stroke="#34594a" stroke-width="2"/></g><text x="270" y="108" font-size="25" text-anchor="start" fill="#17324d">Telur pada daun.</text><path d="M675 199 L675 212 M668 206 L675 213 L682 206" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="214" width="672" height="132" rx="18" fill="#dbeafe"/><text x="45" y="251" font-size="25" text-anchor="start" fill="#17324d">B</text><g transform="translate(135 220) scale(.95)"><circle cx="22" cy="74" r="17" fill="#65a30d"/><path d="M22 86 L19 98" fill="none" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="43" cy="74" r="17" fill="#65a30d"/><path d="M43 86 L40 98" fill="none" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="64" cy="74" r="17" fill="#65a30d"/><path d="M64 86 L61 98" fill="none" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="85" cy="74" r="17" fill="#65a30d"/><path d="M85 86 L82 98" fill="none" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="91" cy="57" r="20" fill="#a3e635"/><circle cx="96" cy="52" r="3" fill="#17324d"/><path d="M85 39 L82 27 M98 39 L102 27" fill="none" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="258" font-size="25" text-anchor="start" fill="#17324d">Ulat memakan daun.</text><path d="M675 349 L675 362 M668 356 L675 363 L682 356" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="364" width="672" height="132" rx="18" fill="#fef3c7"/><text x="45" y="401" font-size="25" text-anchor="start" fill="#17324d">C</text><g transform="translate(135 370) scale(.95)"><path d="M8 12 L111 12 M58 12 L58 25" fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 25 Q28 47 43 90 Q60 116 79 87 Q90 50 58 25 Z" fill="#86b98c" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 62 L79 74 M45 80 L74 88" fill="none" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="408" font-size="25" text-anchor="start" fill="#17324d">Tubuh terbungkus, melekat</text><text x="270" y="439" font-size="25" text-anchor="start" fill="#17324d">pada ranting.</text><path d="M675 499 L675 512 M668 506 L675 513 L682 506" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="514" width="672" height="132" rx="18" fill="#dcfce7"/><text x="45" y="551" font-size="25" text-anchor="start" fill="#17324d">D</text><g transform="translate(135 520) scale(.95)"><ellipse cx="31" cy="44" rx="26" ry="33" fill="#fb923c" stroke="#34594a" stroke-width="2"/><ellipse cx="89" cy="44" rx="26" ry="33" fill="#fb923c" stroke="#34594a" stroke-width="2"/><ellipse cx="37" cy="87" rx="22" ry="24" fill="#fbbf24" stroke="#34594a" stroke-width="2"/><ellipse cx="83" cy="87" rx="22" ry="24" fill="#fbbf24" stroke="#34594a" stroke-width="2"/><rect x="55" y="28" width="10" height="75" rx="5" fill="#334155"/><path d="M59 30 Q39 2 38 16 M62 30 Q81 2 82 16" fill="none" stroke="#34594a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="558" font-size="25" text-anchor="start" fill="#17324d">Bersayap lebar, dapat</text><text x="270" y="589" font-size="25" text-anchor="start" fill="#17324d">terbang.</text><text x="360" y="692" font-size="21" text-anchor="middle" fill="#17324d">Baca urutan dari atas ke bawah.</text></g></svg>