<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 710" role="img" aria-labelledby="title desc"><title id="title">Kamper pada catatan guru</title><desc id="desc">Catatan guru tentang kamper: awal padatan besar; kemudian padatan mengecil tanpa cairan di alas. Guru menjelaskan sebagian zat berpindah langsung dari padat menjadi gas. Bahan tidak ditangani atau dicium dekat oleh siswa.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="710" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Kamper pada catatan guru</text><rect x="35" y="100" width="290" height="350" rx="18" fill="white" stroke="none" stroke-width="3"/><rect x="395" y="100" width="290" height="350" rx="18" fill="white" stroke="none" stroke-width="3"/><text x="180" y="148" font-size="28" fill="#17324d" text-anchor="middle" font-weight="500">Awal</text><text x="540" y="148" font-size="28" fill="#17324d" text-anchor="middle" font-weight="500">Kemudian</text><circle cx="180" cy="280" r="65" fill="#e2e8f0"/><circle cx="540" cy="280" r="32" fill="#e2e8f0"/><path d="M95 365 H265 M455 365 H625" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="410" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Padatan besar</text><text x="540" y="410" font-size="24" fill="#17324d" text-anchor="middle" font-weight="500">Padatan mengecil</text><text x="38" y="510" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">Tidak ada cairan di alas. Catatan guru:</text><text x="38" y="541" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">sebagian padat langsung menjadi gas. Bukan</text><text x="38" y="572" font-size="24" fill="#17324d" text-anchor="start" font-weight="500">percobaan mandiri siswa.</text></g></svg>