<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Letak tempat di lingkungan</title><desc id="desc">Denah utara di atas: sekolah di tengah, taman di atas sekolah, pasar di kanan sekolah, rumah di bawah sekolah. Jalan menghubungkan sekolah dengan ketiganya. Tidak berskala.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="720" height="680" rx="24" fill="#eff6ff" stroke="none" stroke-width="3"/><text x="360" y="42" font-size="28" fill="#17324d" text-anchor="middle" font-weight="750">Letak tempat di lingkungan</text><path d="M350 180 V470 M350 325 H590" fill="none" stroke="#94a3b8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="148" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="350" y="188" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Taman</text><rect x="260" y="293" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="350" y="333" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Sekolah</text><rect x="500" y="293" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="590" y="333" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Pasar</text><rect x="260" y="438" width="180" height="64" rx="12" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="350" y="478" font-size="24" fill="#17324d" text-anchor="middle" font-weight="650">Rumah</text><circle cx="110" cy="180" r="70" fill="white"/><text x="110" y="132" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">U</text><text x="165" y="187" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">T</text><text x="110" y="242" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">S</text><text x="55" y="187" font-size="23" fill="#17324d" text-anchor="middle" font-weight="750">B</text><path d="M110 180 L110.0 145.35" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="604" font-size="23" fill="#17324d" text-anchor="middle" font-weight="500">Jalan berupa garis abu-abu; tidak berskala.</text></g></svg>