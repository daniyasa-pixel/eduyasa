<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Memilih jalur aman</title><desc id="desc">Jalur A tampak kering dan bersih, sedangkan Jalur B memiliki genangan air.</desc><rect width="640" height="360" rx="28" fill="#eff6ff"/><rect x="30" y="25" width="580" height="310" rx="20" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="170" y="70" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#15803d">JALUR A</text><text x="470" y="70" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#b91c1c">JALUR B</text><rect x="65" y="100" width="210" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><path d="M95 175h150" stroke="#15803d" stroke-width="8" stroke-dasharray="20 15"/><text x="170" y="290" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#15803d">kering</text><rect x="365" y="100" width="210" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><ellipse cx="470" cy="180" rx="70" ry="28" fill="#60a5fa"/><path d="M395 130l25 20m-10-35l22 18" stroke="#93c5fd" stroke-width="6"/><text x="470" y="290" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#b91c1c">basah dan licin</text></svg>