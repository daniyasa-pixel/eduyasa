<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Izin membagikan karya</title><desc id="desc">Kartu kiri bertanya boleh difoto; kartu kanan menyatakan langsung unggah tanpa izin.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect x="45" y="80" width="260" height="200" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><text x="175" y="140" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#166534"><tspan x="175">Boleh aku foto</tspan><tspan x="175" dy="36">dan bagikan?</tspan></text><circle cx="175" cy="235" r="24" fill="#16a34a"/><path d="M164 235 L173 245 L190 222" fill="none" stroke="#fff" stroke-width="7"/><rect x="340" y="80" width="255" height="200" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/><text x="468" y="140" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#991b1b"><tspan x="468">Langsung unggah,</tspan><tspan x="468" dy="36">tidak perlu izin!</tspan></text><path d="M430 215 L510 275 M510 215 L430 275" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/></svg>