<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Kartu pengamatan ciri ikan</title><desc id="desc">Seekor ikan dengan badan lonjong, sirip atas dan bawah, serta ekor. Tiga penunjuk memberi label badan lonjong, sirip, dan ekor.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="320" y="55" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">KARTU PENGAMATAN IKAN</text><ellipse cx="310" cy="190" rx="110" ry="58" fill="#38bdf8" stroke="#0369a1" stroke-width="4"/><polygon points="410,190 495,125 495,255" fill="#0ea5e9" stroke="#0369a1" stroke-width="4"/><polygon points="285,135 330,90 350,150" fill="#7dd3fc" stroke="#0369a1" stroke-width="3"/><polygon points="285,245 335,285 350,225" fill="#7dd3fc" stroke="#0369a1" stroke-width="3"/><circle cx="260" cy="175" r="7" fill="#0f172a"/><line x1="250" y1="130" x2="150" y2="90" stroke="#334155" stroke-width="3"/><text x="120" y="82" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">badan lonjong</text><line x1="330" y1="105" x2="400" y2="72" stroke="#334155" stroke-width="3"/><text x="450" y="68" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">sirip</text><line x1="470" y1="190" x2="545" y2="190" stroke="#334155" stroke-width="3"/><text x="575" y="198" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">ekor</text></svg>