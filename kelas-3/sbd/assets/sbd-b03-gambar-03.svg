<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Urutan stensil</title><desc id="desc">Tiga kartu menunjukkan menggambar pola, menggunting, dan meletakkan pola pada kertas.</desc><rect width="640" height="360" rx="24" fill="#f8fafc"/><rect x="18" y="18" width="604" height="324" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><g font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle"><rect x="45" y="80" width="165" height="210" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="128" y="112" fill="#92400e">1. GAMBAR</text><path d="M90 225 Q80 155 135 135 Q190 170 150 235 Q115 270 90 225Z" fill="#86efac" stroke="#15803d" stroke-width="5"/><rect x="238" y="80" width="165" height="210" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="320" y="112" fill="#991b1b">2. GUNTING</text><g fill="none" stroke="#475569" stroke-width="8"><circle cx="285" cy="225" r="22"/><circle cx="345" cy="225" r="22"/><path d="M302 208 L370 145 M328 208 L270 145"/></g><rect x="430" y="80" width="165" height="210" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="512" y="112" fill="#1e3a8a">3. LETAKKAN</text><rect x="455" y="135" width="115" height="120" fill="#fff" stroke="#64748b" stroke-width="3"/><path d="M480 220 Q470 165 515 150 Q555 175 530 225 Q505 250 480 220Z" fill="#86efac" stroke="#15803d" stroke-width="4"/></g></svg>